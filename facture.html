<body>
<div class="top"><img src="img/metier-plus-blanc.svg" alt="Métier+"><b>Facture</b><span class="sp"></span><span id="qui" style="font-size:.9rem;opacity:.85"></span><a href="carte.html">Ma carte</a></div>

<script>
const $ = s => document.querySelector(s), esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const LS = { get:(k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } }, set:(k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };
const API = "https://nhxhfiaznuifcbobjuuv.supabase.co/rest/v1/rpc/", CLE = "sb_publishable_GwzHRE-rG-rVafG7QcTOxg_S68OQHXh", te = new TextEncoder(), td = new TextDecoder();
const rpc = async (f, a) => { const r = await fetch(API + f, { method:"POST", headers:{ apikey:CLE, "Content-Type":"application/json" }, body:JSON.stringify(a || {}), cache:"no-store" }); if (!r.ok) throw new Error("Internet ne répond pas"); return r.json(); };
const hex = async s => [...new Uint8Array(await crypto.subtle.digest("SHA-256", te.encode(s)))].map(b => b.toString(16).padStart(2, "0")).join("");
const toast = t => { document.querySelectorAll(".toast").forEach(x => x.remove()); const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); };
const argent = n => (Math.round((+n || 0) * 100) / 100).toLocaleString("fr-CA", { minimumFractionDigits:2, maximumFractionDigits:2 }) + " $";
const num = v => { const n = parseFloat(String(v ?? "").replace(/\s/g, "").replace(",", ".")); return isFinite(n) ? n : 0; };
const TPS = 0.05, TVQ = 0.09975;

/* ---------- la carte de l'élève (même entrée que le magasin) ---------- */
let K = LS.get("mpCarte", null), C = null;   /* C = { c:code, k:clé } */
function lireK(){ const m = K && String(K.c || "").match(/^MP-(\d{5})-([A-Z0-9]{4,12})$/); C = m ? { c:m[1], k:m[2] } : null; }
function entree(){ $("#barre").hidden = true; $("#qui").textContent = "";
  $("#app").innerHTML = `<h1>Facture au client</h1><p class="sous">Ta carte doit être sur ce cellulaire : ouvre <a href="carte.html">Ma carte</a> et scanne le code QR de ta fiche.</p><div class="carte"><input class="cache-code code" id="cCode" inputmode="numeric" autocomplete="off" placeholder="00000" aria-label="Ton code"><p class="err" id="cErr"></p><button class="btn p" id="cOk">Entrer</button></div>`;
  const i = $("#cCode"), go = async () => { const c = i.value.trim(); if (!/^\d{5}$/.test(c)) { $("#cErr").textContent = "Écris ton code à 5 chiffres."; return; }
    $("#cErr").textContent = "Recherche…"; try { const o = await codeEssai(c);   /* 27 nov. (Loi 25) : seul le code d'essai s'ouvre ici; un élève ouvre d'abord Ma carte (code QR de sa fiche) */
      if (!o) { $("#cErr").innerHTML = 'Ouvre d\'abord <a href="carte.html">Ma carte</a> sur ce cellulaire (code QR de ta fiche).'; return; }
      K = { c:o.c, g:o.g || "", p:o.p || "", t:Date.now() }; LS.set("mpCarte", K); lireK(); demarrer(); } catch(e){ $("#cErr").textContent = e.message; } };
  i.oninput = () => { if (/^\d{5}$/.test(i.value.trim())) go(); }; i.onkeydown = e => { if (e.key === "Enter") go(); }; $("#cOk").onclick = go; i.focus(); }

/* ---------- sauvegarde : sur l'appareil + copie chiffrée avec la clé de la carte ---------- */
let F = [];   /* factures */
const cleLocale = () => "factures|" + C.c;
async function cleAES(){ return crypto.subtle.importKey("raw", await crypto.subtle.digest("SHA-256", te.encode("metier+|factures-cle|" + C.c + "|" + C.k)), "AES-GCM", false, ["encrypt", "decrypt"]); }
async function charger(){ F = LS.get(cleLocale(), []);
  try { const r = await rpc("coffre_lire", { p_id:await hex("metier+|factures|" + C.c + "|" + C.k) }), row = r && r[0]; if (!row || !row.data) return;
    const b = Uint8Array.from(atob(JSON.parse(row.data).d), x => x.charCodeAt(0)), L = JSON.parse(td.decode(await crypto.subtle.decrypt({ name:"AES-GCM", iv:b.slice(0, 12) }, await cleAES(), b.slice(12))));
    const M = new Map(F.map(f => [f.id, f])); L.forEach(f => { const a = M.get(f.id); if (!a || (f.modif || 0) > (a.modif || 0)) M.set(f.id, f); }); F = [...M.values()].sort((a, b) => (b.modif || 0) - (a.modif || 0)); LS.set(cleLocale(), F); } catch(e){} }
let sauvT = 0;
function sauver(){ LS.set(cleLocale(), F); clearTimeout(sauvT); sauvT = setTimeout(async () => { try {
    const iv = crypto.getRandomValues(new Uint8Array(12)), ct = new Uint8Array(await crypto.subtle.encrypt({ name:"AES-GCM", iv }, await cleAES(), te.encode(JSON.stringify(F)))), u = new Uint8Array(12 + ct.length); u.set(iv); u.set(ct, 12);
    let s = ""; for (let i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768));
    await rpc("coffre_ecrire", { p_id:await hex("metier+|factures|" + C.c + "|" + C.k), p_jeton:await hex("metier+|factures-jeton|" + C.c + "|" + C.k), p_env:"public", p_data:JSON.stringify({ v:1, d:btoa(s) }) }); } catch(e){} }, 1500); }

/* 26 nov. (Jeremy : « les clients se rajoutent au hasard ») : client fictif tiré au hasard, comme un appel de service.
   Téléphones en 555 et courriels @exemple.com : jamais une vraie personne. */
const CLIENTS = { pre:["Sylvie","Martin","Nathalie","Éric","Isabelle","Stéphane","Julie","François","Caroline","Patrick","Annie","Mathieu","Josée","Sébastien","Mélanie","Daniel","Chantal","Alexandre","Geneviève","Luc","Marie-Ève","Guillaume","Véronique","Jean-François"],
  nom:["Bérubé","Ouellet","Pelletier","Lévesque","Dionne","Gagnon","Thériault","Michaud","Bélanger","Morin","Lavoie","Dubé","Saint-Pierre","Desjardins","Côté","Fortin","Lepage","Gauvin","Caron","Beaulieu","Roy","Bouchard","Sirois","Lebel"],
  rue:["rue des Érables","rue Lafontaine","boulevard Thériault","rue Fraser","rue Saint-Pierre","chemin des Raymond","rue de la Grève","avenue du Parc","rue Principale","rang Sainte-Anne","rue des Pins","rue Hayward"],
  ville:[["Rivière-du-Loup","G5R"],["Cacouna","G0L"],["Saint-Antonin","G0L"],["Notre-Dame-du-Portage","G0L"],["Trois-Pistoles","G0L"],["Saint-Pascal","G0L"],["Kamouraska","G0L"],["Saint-Alexandre-de-Kamouraska","G0L"],["L'Isle-Verte","G0L"],["Saint-Hubert-de-Rivière-du-Loup","G0L"]] };
function clientHasard(){ const h = a => a[Math.floor(Math.random() * a.length)], pr = h(CLIENTS.pre), no = h(CLIENTS.nom), v = h(CLIENTS.ville);
  const n = (Math.floor(Math.random() * 9) + 1) + "" + (Math.floor(Math.random() * 900) + 100), cp = v[1] + " " + Math.floor(Math.random() * 9) + "ABCEGHJKLMNPRSTVXY"[Math.floor(Math.random() * 18)] + Math.floor(Math.random() * 9);
  const sans = t => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z]/g, "");
  return { nom:pr + " " + no, adresse:n + ", " + h(CLIENTS.rue) + ", " + v[0] + " (Québec) " + cp, tel:"418 555-" + String(Math.floor(Math.random() * 10000)).padStart(4, "0"), courriel:sans(pr) + "." + sans(no) + "@exemple.com" }; }

/* 26 nov. (Jeremy : « il se décide un nom d'entreprise pour lui et son équipier de coffre ») : entreprise commune à l'équipe.
   Rangée partagée, trouvée et chiffrée avec les deux codes (les deux équipiers les connaissent). */
/* 26 nov. (Jeremy : « c'est à recommencer aux mêmes conditions que le coffre ») : l'entreprise suit le coffre de l'équipe
   (coffres publiés par l'enseignant : équipe = codes des élèves, « tour » augmenté au changement d'équipe ou à la fin de session).
   Nouveau tour = nouvelle entreprise. Sans coffre trouvé : code de l'équipier tapé à la main. */
let EQ = null;
async function trouverCoffre(){ try { const CP = (await (await fetch("comptes.json", { cache:"no-cache" })).json()).comptes || {};
    for (const ens of Object.keys(CP).filter(id => !CP[id].eleve)) { const r = await rpc("coffre_lire", { p_id:await hex("metier+|coffres-pub|" + ens) }), row = r && r[0]; if (!row || !row.data) continue;
      const o = JSON.parse(row.data); for (const [cid, cf] of Object.entries(o.cf || {})) if ((cf.eqc || []).includes(C.c)) { EQ = { ens, cid, tour:cf.tour || 0, nom:cf.nom || "", eq:cf.eqc.filter(x => x !== C.c) }; return; } } } catch(e){} }
const paire = () => { if (EQ) return "coffre|" + EQ.ens + "|" + EQ.cid + "|" + EQ.tour; const e = LS.get("equipier|" + C.c, ""); return /^\d{5}$/.test(e) && e !== C.c ? [C.c, e].sort().join("|") : ""; };
const entLS = () => "entreprise|" + (paire() || C.c);
async function entCle(pr){ return crypto.subtle.importKey("raw", await crypto.subtle.digest("SHA-256", te.encode("metier+|entreprise-cle|" + pr)), "AES-GCM", false, ["encrypt", "decrypt"]); }
async function entLire(){ const pr = paire(); if (!pr) return null; try { const r = await rpc("coffre_lire", { p_id:await hex("metier+|entreprise|" + pr) }), row = r && r[0]; if (!row || !row.data) return null;
  const b = Uint8Array.from(atob(JSON.parse(row.data).d), x => x.charCodeAt(0)); return JSON.parse(td.decode(await crypto.subtle.decrypt({ name:"AES-GCM", iv:b.slice(0, 12) }, await entCle(pr), b.slice(12)))); } catch(e){ return null; } }
async function entEcrire(ent){ const pr = paire(); LS.set(entLS(), ent); if (!pr) return; try {
  const iv = crypto.getRandomValues(new Uint8Array(12)), ct = new Uint8Array(await crypto.subtle.encrypt({ name:"AES-GCM", iv }, await entCle(pr), te.encode(JSON.stringify(Object.assign({}, ent, { t:Date.now() }))))), u = new Uint8Array(12 + ct.length); u.set(iv); u.set(ct, 12);
  await rpc("coffre_ecrire", { p_id:await hex("metier+|entreprise|" + pr), p_jeton:await hex("metier+|entreprise-jeton|" + pr), p_env:"public", p_data:JSON.stringify({ v:1, d:btoa(String.fromCharCode(...u)) }) }); } catch(e){} }
let ENT = null;   /* entreprise de l'équipe, la plus récente */
async function entSync(){ const e = await entLire(); if (e) { ENT = e; LS.set(entLS(), e); } else ENT = LS.get(entLS(), null); }

/* 26 nov. (Jeremy : « créer un logo fictif », « fais-en quelques-uns, ils vont choisir au début », « plus beau ») :
   6 logos dessinés (SVG) + 6 couleurs; l'équipe choisit, les initiales viennent du nom de l'entreprise */
const COULEURS = ["#1F5F8B", "#B83227", "#1E8E4E", "#D9601C", "#5B3A9A", "#22313F"], ICONES = ["goutte", "flamme", "cle", "maison", "raccord", "mono"];
const NOMS_LOGO = { goutte:"Goutte", flamme:"Flamme", cle:"Clé à tuyau", maison:"Maison", raccord:"Raccord", mono:"Initiales" };
const initiales = n => String(n || "").replace(/\b(inc|enr|ltée|ltee|senc|et|de|du|des|la|le|les)\b\.?/gi, " ").split(/[\s&-]+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "MP";
const fonce = (h, k) => "#" + [1, 3, 5].map(i => Math.round(parseInt(h.slice(i, i + 2), 16) * k).toString(16).padStart(2, "0")).join("");
function logoSVG(ent){ const c = COULEURS[+ent.coul || 0], d = fonce(c, 0.62), ic = ICONES.includes(ent.icone) ? ent.icone : "goutte", ini = esc(initiales(ent.nom)), id = "g" + (+ent.coul || 0) + ic;
  const grad = `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="${d}"/></linearGradient></defs>`, F = `fill="url(#${id})"`;
  const txt = (y, z, col) => `<text x="50" y="${y}" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-weight="800" font-size="${z}" fill="${col}" letter-spacing="1">${ini}</text>`;
  const corps = {
    goutte:`<circle cx="50" cy="50" r="47" ${F}/><circle cx="50" cy="50" r="41" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/><path d="M50 16C50 16 27 43 27 59a23 23 0 0 0 46 0C73 43 50 16 50 16z" fill="#fff"/>${txt(66, 17, c)}`,
    flamme:`<path d="M50 5L88 18v29c0 24-16 40-38 48C28 87 12 71 12 47V18z" ${F}/><path d="M50 12l31 11v24c0 20-13 33-31 40-18-7-31-20-31-40V23z" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/><path d="M50 22c9 13 20 21 18 37-1 12-9 19-18 19s-18-7-18-19c0-10 7-16 10-26 4 7 8 4 8-11z" fill="#fff"/><path d="M50 50c4 6 8 9 7 15-1 5-4 7-7 7s-7-3-7-7c0-5 4-8 7-15z" fill="${c}"/>`,
    cle:`<path d="M50 4l40 23v46L50 96 10 73V27z" ${F}/><path d="M50 11l34 19.5v39L50 89 16 69.5v-39z" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/><g transform="rotate(-40 50 50)" fill="#fff"><rect x="45" y="36" width="10" height="44" rx="4"/><path d="M38 20h26v9h-7v10H43v-6h-5z"/><rect x="40" y="31" width="20" height="5" rx="1.5" fill="${c}"/><rect x="47.5" y="66" width="5" height="10" rx="2" fill="${c}" opacity=".5"/></g>`,
    maison:`<rect x="3" y="3" width="94" height="94" rx="22" ${F}/><path d="M20 50L50 24l30 26" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 45v32h44V45" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round"/><path d="M50 49c0 0-9 11-9 17a9 9 0 0 0 18 0c0-6-9-17-9-17z" fill="#fff"/>`,
    raccord:`<circle cx="50" cy="50" r="47" ${F}/><circle cx="50" cy="50" r="41" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/><path d="M18 44h64M50 44v38" stroke="#fff" stroke-width="13" fill="none"/><g fill="#fff"><rect x="13" y="34" width="9" height="20" rx="2"/><rect x="78" y="34" width="9" height="20" rx="2"/><rect x="40" y="78" width="20" height="9" rx="2"/><rect x="38" y="32" width="24" height="24" rx="4"/></g><rect x="44" y="38" width="12" height="12" rx="2" fill="${c}"/>`,
    mono:`<rect x="3" y="3" width="94" height="94" rx="22" ${F}/>${txt(55, 32, "#fff")}<path d="M20 74h50a10 10 0 0 0 10-10v-2" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="75" y="57" width="10" height="7" rx="1.5" fill="#fff"/>` }[ic];
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">${grad}${corps}</svg>`; }
/* PNG pour le PDF */
function logoPNG(ent, z){ return new Promise(ok => { const im = new Image(), cv = document.createElement("canvas"); cv.width = cv.height = z;
  im.onload = () => { cv.getContext("2d").drawImage(im, 0, 0, z, z); ok(cv.toDataURL("image/png")); }; im.onerror = () => ok(null);
  im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(logoSVG(ent)); }); }

/* 26 nov. (Jeremy : « au début de la session il choisit et ça reste ») : l'équipe crée son entreprise une fois; ses factures la reprennent */
const ENT_VIDE = { nom:"", rbq:"", tps:"", tvq:"", tel:"", courriel:"", icone:"goutte", coul:0 };
/* 26 nov. (Jeremy : « licence, TPS et TVQ s'ajoutent tout seuls, le courriel fitte avec le nom ») : numéros fictifs au bon format,
   toujours les mêmes pour l'équipe (tirés de sa clé); courriel en .exemple.ca (jamais une vraie entreprise) */
function chiffres(graine, n){ let h = 2166136261, o = ""; for (let i = 0; o.length < n; i++) { h = Math.imul(h ^ (graine.charCodeAt(i % graine.length) + i), 16777619) >>> 0; o += String(h % 10); } return o; }
function auto(e){ const g = paire() || C.c, d = chiffres(g + "|ent", 28), sl = String(e.nom || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\b(inc|enr|ltee|senc)\b/g, "").replace(/[^a-z0-9]+/g, "");
  return { rbq:"5" + d.slice(0, 3) + "-" + d.slice(3, 7) + "-" + d.slice(7, 9), tps:d.slice(9, 18) + " RT0001", tvq:"1" + d.slice(18, 27) + " TQ0001", tel:"418 555-" + d.slice(20, 24), courriel:sl ? "info@" + sl + ".exemple.ca" : "" }; }
function entreprise(retour){ const e = Object.assign({}, ENT_VIDE, ENT || {}); $("#barre").hidden = true; window.scrollTo(0, 0);
  const ch = (l, k, ph, im) => `<div><label>${l}</label><input data-e="${k}" value="${esc(e[k])}" placeholder="${ph || ""}"${im ? ` inputmode="${im}"` : ""}></div>`;
  const vue = () => { $("#app").innerHTML = `${ENT && ENT.nom ? `<p><button class="btn" id="eRet">‹ Retour</button></p>` : ""}<h1>Notre entreprise</h1><p class="sous">Avec ton équipier de coffre, choisissez le nom et le logo de votre entreprise de plomberie. Ils restent pour toutes vos factures.</p>
    <div class="carte"><div class="g2">${ch("Nom de l'entreprise", "nom", "ex. Plomberie Bérubé inc.")}${EQ ? `<div><label>Équipe</label><p style="margin:10px 0 0"><b>${esc(EQ.nom || "Coffre")}</b> · ${EQ.eq.length ? "avec " + EQ.eq.map(esc).join(", ") : "seul"}</p></div>` : `<div><label>Code de ton équipier de coffre</label><input id="eq" inputmode="numeric" maxlength="5" placeholder="5 chiffres" value="${esc(LS.get("equipier|" + C.c, ""))}"></div>`}</div>
      <p class="sous">${EQ ? "Votre entreprise suit votre coffre : elle recommence quand votre enseignant change les équipes." : paire() ? "Entreprise partagée avec ton équipier." : "Entrez chacun le code de l'autre : votre entreprise sera la même sur vos deux appareils."}</p></div>
    <div class="carte"><h2>Logo</h2><div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px">${ICONES.map(i => `<button data-ic="${i}" title="${NOMS_LOGO[i]}" style="width:92px;height:92px;padding:6px;border-radius:18px;background:#fff;cursor:pointer;border:${e.icone === i ? "3px solid var(--nuit)" : "1.5px solid var(--ligne)"}">${logoSVG(Object.assign({}, e, { icone:i })).replace('width="100" height="100"', 'width="76" height="76"')}</button>`).join("")}</div>
      <div style="display:flex;gap:10px">${COULEURS.map((c, k) => `<button data-co="${k}" aria-label="Couleur ${k + 1}" style="width:38px;height:38px;border-radius:50%;border:${(+e.coul || 0) === k ? "3px solid var(--nuit)" : "2px solid #fff"};box-shadow:0 0 0 1px var(--ligne);background:${c};cursor:pointer"></button>`).join("")}</div></div>
    <div class="carte"><h2>Coordonnées (sur vos factures)</h2><p class="sous" style="margin-top:0">Numéros fictifs générés pour votre entreprise (exercice).</p><div class="g2" id="eAuto">${(a => [["Licence RBQ", a.rbq], ["Téléphone", a.tel], ["N° de TPS", a.tps], ["N° de TVQ", a.tvq], ["Courriel", a.courriel || "—"]].map(([l, v]) => `<div><label>${l}</label><p style="margin:4px 0 8px;font-family:ui-monospace,Menlo,Consolas,monospace">${esc(v)}</p></div>`).join(""))(auto(e))}</div></div>
    <p><button class="btn p" id="eOk">${ENT && ENT.nom ? "Enregistrer" : "Créer notre entreprise"}</button></p>`;
    document.querySelectorAll("[data-e]").forEach(i => i.oninput = () => { e[i.dataset.e] = i.value; if (i.dataset.e === "nom") { const a = auto(e), z = $("#eAuto"); if (z) z.querySelectorAll("p")[4].textContent = a.courriel || "—"; } if (i.dataset.e === "nom") document.querySelectorAll("[data-ic]").forEach(b => b.innerHTML = logoSVG(Object.assign({}, e, { icone:b.dataset.ic })).replace('width="100" height="100"', 'width="76" height="76"')); });
    document.querySelectorAll("[data-ic]").forEach(b => b.onclick = () => { e.icone = b.dataset.ic; vue(); });
    document.querySelectorAll("[data-co]").forEach(b => b.onclick = () => { e.coul = +b.dataset.co; vue(); });
    if ($("#eq")) $("#eq").onchange = async () => { const v = $("#eq").value.trim(); if (v && (!/^\d{5}$/.test(v) || v === C.c)) { toast("Écris le code à 5 chiffres de ton équipier."); return; }
      LS.set("equipier|" + C.c, v); const t = v && await entLire(); if (t && t.nom) { Object.assign(e, t); delete e.t; ENT = Object.assign({}, e); toast("Entreprise de ton équipe : " + t.nom); } vue(); };
    if ($("#eRet")) $("#eRet").onclick = retour || liste;
    $("#eOk").onclick = async () => { if (String(e.nom).trim().length < 3) { toast("Donnez un nom à votre entreprise."); return; }
      Object.assign(e, auto(e)); ENT = Object.assign({}, e); await entEcrire(ENT); F.forEach(f => { if (!f.signee) f.ent = Object.assign({}, ENT); }); sauver(); toast("Entreprise enregistrée."); (retour || liste)(); }; };
  vue(); }

/* ---------- liste des factures ---------- */
function totaux(f){ const mo = (f.mo || []).reduce((s, l) => s + num(l.h) * num(l.taux), 0), mat = (f.mat || []).reduce((s, l) => s + num(l.q) * num(l.prix), 0) * (1 + num(f.maj) / 100);
  const st = mo + mat + (f.autres || []).reduce((s, l) => s + num(l.m), 0), tps = st * TPS, tvq = st * TVQ; return { mo, mat, st, tps, tvq, tot:st + tps + tvq }; }
function liste(){ if (!ENT || !ENT.nom) return entreprise(); $("#barre").hidden = true; $("#qui").textContent = (K.p ? K.p + " · " : "") + (K.g === "ESSAI" ? "•••••" : C.c);
  $("#app").innerHTML = `<h1>Mes factures</h1><p class="sous">À la fin d'un projet, fais la facture de ton client comme sur un chantier : travaux, heures, matériel, taxes et signature.</p>
    <div class="carte" style="display:flex;gap:14px;align-items:center">${logoSVG(ENT).replace('width="100" height="100"', 'width="64" height="64"')}<div style="flex:1"><b style="font-size:1.1rem">${esc(ENT.nom)}</b><div class="sous">${EQ ? esc(EQ.nom || "Coffre") + (EQ.eq.length ? " · avec " + EQ.eq.map(esc).join(", ") : "") : paire() ? "Avec ton équipier de coffre" : "Ajoute le code de ton équipier pour partager l'entreprise"}</div></div><button class="btn" id="eMod">Modifier</button></div>
    <p><button class="btn p" id="nv">+ Nouvelle facture</button></p>
    <div class="carte liste">${F.length ? F.map(f => `<div class="f" data-id="${esc(f.id)}"><b>${esc(f.no)} · ${esc(f.client && f.client.nom || "Client à préciser")}</b><span class="sous">${esc(f.date)}</span><span>${argent(totaux(f).tot)}</span><span class="pastille${f.signee ? " ok" : ""}">${f.signee ? "Signée" : "Brouillon"}</span></div>`).join("") : `<p class="sous">Aucune facture pour l'instant.</p>`}</div>`;
  $("#nv").onclick = nouvelle; $("#eMod").onclick = () => entreprise(liste); document.querySelectorAll("[data-id]").forEach(d => d.onclick = () => ouvrir(d.dataset.id)); }
function nouvelle(){ const prec = F[0] || {}, a = new Date().getFullYear(), n = F.filter(f => String(f.no).startsWith("F-" + a)).length + 1;
  const f = { id:Date.now().toString(36) + Math.random().toString(36).slice(2, 6), no:"F-" + a + "-" + String(n).padStart(3, "0"), date:new Date().toLocaleDateString("en-CA"), modif:Date.now(),
    ent:Object.assign({ nom:"", rbq:"", tps:"", tvq:"", tel:"", courriel:"" }, ENT || prec.ent || {}), client:clientHasard(), travaux:"", mo:[{ d:"Main-d'œuvre — plombier", h:"", taux:"" }], mat:[], maj:"", autres:[], cond:"Payable sur réception. Merci de votre confiance !", signee:null };
  F.unshift(f); sauver(); ouvrir(f.id); }

/* ---------- la facture ---------- */
let FA = null;
let ET = 1, ET_VU = 0;   /* 26 nov. (Jeremy : « 1-2-6 ») : la facture en 4 étapes */
async function ouvrir(id){ FA = F.find(f => f.id === id); if (!FA) return liste(); if (!FA.signee && ENT) FA.ent = Object.assign({}, ENT); ET = FA.signee ? 4 : 1; ET_VU = 0; window.scrollTo(0, 0); await catalogue(); if (FA && FA.id === id) dessiner(); }
function champ(lbl, chemin, opt){ const v = chemin.split(".").reduce((o, k) => o && o[k], FA) ?? ""; return `<div><label>${lbl}</label><input data-c="${chemin}" value="${esc(v)}"${opt || ""}></div>`; }
const ETAPES = ["Client", "Travaux", "Matériel", "Signature"];
const artDe = d => { const m = String(d || "").match(/\(([^()]+)\)\s*$/); return m && CAT ? CAT.find(z => z.n === m[1]) : null; };
const photoMat = d => { const a = artDe(d), u = !a || a.img === "-" ? "" : (a.img || PHOTOS[String(a.type || "").toLowerCase() + "|" + (a.mat || "")] || "");
  return u ? `<span class="fph"><img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.src='img/metier-plus-icone.svg';this.parentNode.classList.add('vide')"></span>` : `<span class="fph vide"><img src="img/metier-plus-icone.svg" alt=""></span>`; };
function dessiner(){ const f = FA, T = totaux(f), L = (t, arr, cols) => arr.map((l, i) => `<tr>${cols.map(([k, ph, cls, im]) => `<td class="${cls || ""}"><input data-l="${t}.${i}.${k}" value="${esc(l[k] ?? "")}" placeholder="${ph}"${im ? ' inputmode="decimal"' : ""}></td>`).join("")}<td class="x"><button data-del="${t}.${i}" aria-label="Retirer">×</button></td></tr>`).join("");
  const fait = [!!String(f.client.nom || "").trim(), !!(String(f.travaux || "").trim() || f.mo.some(l => num(l.h))), f.mat.some(l => l.d), !!f.signee];
  const anim = ET !== ET_VU; ET_VU = ET;
  const suite = n => `<div class="fnav">${n > 1 ? `<button class="btn" data-et="${n - 1}">‹ ${ETAPES[n - 2]}</button>` : "<span></span>"}${n < 4 ? `<button class="btn p" data-et="${n + 1}">Suivant : ${ETAPES[n]} ›</button>` : ""}</div>`;
  const mats = f.mat.map((l, i) => { const sp = l.d && !num(l.prix); return `<div class="fm${sp ? " sansprix" : ""}">${photoMat(l.d)}
      <div class="fm-n"><input data-l="mat.${i}.d" value="${esc(l.d ?? "")}" placeholder="Pièce">${sp ? `<small class="np">Prix à entrer</small>` : num(l.q) && num(l.prix) ? `<small class="sous">${esc(l.q)} × ${argent(num(l.prix))} = <b>${argent(num(l.q) * num(l.prix))}</b></small>` : ""}</div>
      <div class="fm-q"><button data-mq="${i}|-1" aria-label="Un de moins">−</button><input data-l="mat.${i}.q" value="${esc(l.q ?? "")}" inputmode="decimal" aria-label="Quantité"><button data-mq="${i}|1" aria-label="Un de plus">+</button></div>
      <div class="fm-p"><input data-l="mat.${i}.prix" value="${esc(l.prix ?? "")}" placeholder="0,00" inputmode="decimal" aria-label="Prix unitaire"><span>$</span></div>
      <div class="x"><button data-del="mat.${i}" aria-label="Retirer">×</button></div></div>`; }).join("");
  $("#qui").textContent = (K.p ? K.p + " · " : "") + (K.g === "ESSAI" ? "•••••" : C.c);
  $("#app").className = anim ? "anim" : "";
  $("#app").innerHTML = `<p style="margin:0"><button class="lien" id="ret">‹ Mes factures</button></p><h1 class="fh">Facture ${esc(f.no)} <span class="cachet">SIMULATION</span></h1>
  <nav class="fsteps">${ETAPES.map((t, k) => `${k ? `<span class="fbar${fait[k - 1] || ET > k ? " ok" : ""}"></span>` : ""}<button class="fst${ET === k + 1 ? " cours" : ""}${fait[k] ? " ok" : ""}" data-et="${k + 1}"><i>${fait[k] ? `<svg viewBox="0 0 24 24" width="16" height="16"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>` : k + 1}</i><span>${t}</span></button>`).join("")}</nav>
  <section ${ET === 1 ? "" : "hidden"}>
  <div class="carte fent">${logoSVG(f.ent).replace('width="100" height="100"', 'width="52" height="52"')}<div style="flex:1"><b>${esc(f.ent.nom)}</b><div class="sous">${esc([f.ent.tel, f.ent.rbq ? "RBQ " + f.ent.rbq : ""].filter(Boolean).join(" · "))}</div></div>${f.signee ? "" : `<button class="btn" id="eMod2">Modifier</button>`}</div>
  <div class="carte"><h2 class="fh2">Client <span class="sous">(fictif)</span><span style="flex:1"></span><button class="btn petit" id="autreCl">Autre client</button></h2><div class="g2">${champ("Nom du client", "client.nom")}${champ("Téléphone", "client.tel", ' inputmode="tel"')}${champ("Adresse des travaux", "client.adresse")}${champ("Courriel", "client.courriel", ' inputmode="email"')}</div>
    <div class="g2" style="margin-top:10px">${champ("N° de facture", "no")}<div><label>Date</label><input type="date" data-c="date" value="${esc(f.date)}"></div></div></div>${suite(1)}</section>
  <section ${ET === 2 ? "" : "hidden"}>
  <div class="carte"><h2 class="fh2">Travaux effectués</h2><textarea data-c="travaux" placeholder="ex. Remplacement du chauffe-eau 40 gal, raccordement eau chaude et froide, essai d'étanchéité.">${esc(f.travaux)}</textarea></div>
  <div class="carte"><h2 class="fh2">Main-d'œuvre</h2><table class="l"><tr><th>Description</th><th>Heures</th><th>Taux ($/h)</th><th></th></tr>${L("mo", f.mo, [["d", "Description"], ["h", "0", "n", 1], ["taux", "0,00", "n", 1]])}</table>
    <div class="fpied"><button class="btn petit" data-plus="mo">+ Ligne</button><span>Main-d'œuvre : <b>${argent(T.mo)}</b></span></div></div>${suite(2)}</section>
  <section ${ET === 3 ? "" : "hidden"}>
  <div class="carte"><h2 class="fh2">Matériel</h2><div class="fimp"><button class="btn b" id="imp">Raccords pris au magasin</button><button class="btn" id="cat">Ajouter depuis la liste du magasin</button></div>
    ${f.mat.length ? `<div class="fms">${mats}</div>` : `<p class="vide">Aucune pièce pour l'instant. Ajoute les raccords que tu as pris au magasin.</p>`}
    ${f.mat.some(l => l.d && !num(l.prix)) ? `<p class="avisP">Il manque des prix. Écris le prix de chaque pièce pour que la facture soit juste.</p>` : ""}
    <div class="fpied"><button class="btn petit" data-plus="mat">+ Ligne</button><span>Matériel : <b>${argent(T.mat)}</b></span></div>
    <div class="g2" style="margin-top:12px;align-items:end"><div><label>Majoration sur le matériel (%)</label><input data-c="maj" inputmode="decimal" value="${esc(f.maj || "")}" placeholder="ex. 20"></div><p class="sous" style="margin:0">Le profit ajouté au prix des pièces.</p></div></div>
  <div class="carte"><h2 class="fh2">Autres frais</h2><table class="l"><tr><th>Description</th><th>Montant</th><th></th></tr>${L("autres", f.autres, [["d", "ex. Déplacement, permis, disposition"], ["m", "0,00", "n", 1]])}</table><div class="fpied"><button class="btn petit" data-plus="autres">+ Ligne</button></div></div>${suite(3)}</section>
  <section ${ET === 4 ? "" : "hidden"}>
  <div class="carte"><div class="tot"><span>Sous-total</span><span>${argent(T.st)}</span><span>TPS (5 %)</span><span>${argent(T.tps)}</span><span>TVQ (9,975 %)</span><span>${argent(T.tvq)}</span><span class="g">Total</span><span class="g">${argent(T.tot)}</span></div>
    <label style="margin-top:12px">Conditions de paiement</label><input data-c="cond" value="${esc(f.cond)}"></div>
  <div class="carte"><h2 class="fh2">Signature du client</h2>${f.signee ? `<img src="${f.signee.img}" alt="Signature" style="max-width:100%;height:120px;object-fit:contain;background:#fff;border:1px solid var(--ligne);border-radius:12px"><p class="sous">Signée par ${esc(f.signee.nom)} le ${esc(f.signee.date)}.</p><button class="btn" id="sigX">Effacer la signature</button>`
    : `<p class="sous">Le client signe avec le doigt pour accepter les travaux et la facture.</p><canvas id="sig"></canvas><div class="g2" style="margin-top:8px;align-items:end"><div><label>Nom du client (en lettres moulées)</label><input id="sigN" value="${esc(f.client.nom)}"></div><div style="display:flex;gap:8px"><button class="btn" id="sigE">Recommencer</button><button class="btn b" id="sigOk">Accepter et signer</button></div></div>`}</div>
  ${suite(4)}<p style="text-align:center"><button class="lien" id="supp" style="color:#B42318">Supprimer cette facture</button></p></section>`;
  $("#barre").hidden = false; $("#barre").innerHTML = `<b style="margin-right:auto;align-self:center">Total : ${argent(T.tot)}</b><button class="btn" id="mel">Envoyer par courriel</button><button class="btn p" id="pdf">PDF de la facture</button>`;
  brancher(); }
