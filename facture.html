<!DOCTYPE html>
<html lang="fr-CA">
<head>

<style>
/* © 2026 Jérémy Raymond. Tous droits réservés. Métier+ — facture au client (26 nov.)
   Jeremy : « à la fin de leur projet, les élèves font une facture au client, comme sur les chantiers; ça part de leur carte ».
   Modèle : applications de chantier (Jobber, Sercom) : client, travaux, main-d'œuvre, matériel, taxes, signature du client, PDF.
   Les factures restent sur l'appareil et une copie chiffrée avec la clé de la carte est gardée en ligne (retrouvée chez soi). */
[hidden]{display:none!important}*{box-sizing:border-box}
:root{--bleu:#1F5F8B;--nuit:#1E2A44;--acc:#EB6A22;--ligne:#D5DAE3;--fond:#F3F5F8;--gris:#6B7280;--vert:#1E8E4E}
html,body{margin:0;background:var(--fond);color:var(--nuit);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.top{position:sticky;top:0;z-index:5;background:var(--nuit);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.top img{height:26px}.top b{font-size:1.05rem}.top .sp{flex:1}.top a,.top button{color:#fff;background:transparent;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:8px 12px;font:inherit;text-decoration:none;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:1.4rem;margin:6px 0 4px}.sous{color:var(--gris);font-size:.92rem}
.carte{background:#fff;border:1px solid var(--ligne);border-radius:16px;padding:16px 18px;margin:12px 0}
.carte h2{font-size:1rem;margin:0 0 10px;color:var(--bleu);text-transform:uppercase;letter-spacing:.04em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media (max-width:620px){.g2{grid-template-columns:1fr}}
label{display:block;font-size:.85rem;font-weight:600;margin:0 0 3px}
input,textarea,select{width:100%;min-height:44px;border:1.5px solid var(--ligne);border-radius:10px;padding:8px 10px;font:inherit;background:#fff;color:inherit}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--bleu);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 16px;border-radius:12px;border:1.5px solid var(--ligne);background:#fff;color:var(--nuit);font:inherit;font-weight:700;cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.b{background:var(--bleu);border-color:var(--bleu);color:#fff}
table.l{width:100%;border-collapse:collapse}table.l th{text-align:left;font-size:.8rem;color:var(--gris);padding:4px 4px}table.l td{padding:4px}
table.l td.n{width:90px}table.l td.x{width:44px}table.l input{min-height:40px}
.x button{width:40px;height:40px;border-radius:10px;border:1px solid var(--ligne);background:#fff;font-size:1.2rem;cursor:pointer;color:var(--gris)}
.tot{display:grid;grid-template-columns:1fr auto;gap:4px 18px;max-width:340px;margin-left:auto}.tot span{text-align:right}.tot .g{font-weight:800;font-size:1.15rem;border-top:2px solid var(--nuit);padding-top:6px}
.code{display:block;width:100%;max-width:420px;font:800 2.6rem/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.25em;text-align:center;padding:16px;border-radius:16px;border:2px solid var(--ligne);margin:10px 0}
.err{color:#B42318;min-height:1.2em;margin:6px 0}
.liste .f{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--ligne);cursor:pointer}.liste .f:last-child{border:0}.liste .f b{flex:1}
.pastille{font-size:.78rem;padding:3px 10px;border-radius:999px;background:#EEF2F7;color:var(--gris);font-weight:700}.pastille.ok{background:#E6F4EC;color:var(--vert)}
#sig{width:100%;height:170px;border:1.5px dashed var(--ligne);border-radius:12px;background:#fff;touch-action:none;display:block}
.barre{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--ligne);padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;z-index:5}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--nuit);color:#fff;padding:10px 16px;border-radius:12px;z-index:9}
</style>
</head>
<body>
<div class="top"><img src="img/metier-plus-blanc.svg" alt="Métier+"><b>Facture</b><span class="sp"></span><span id="qui" style="font-size:.9rem;opacity:.85"></span><a href="carte.html">Ma carte</a></div>
<main id="app"></main>
<div class="barre" id="barre" hidden></div>
<script>
const $ = s => document.querySelector(s), esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const LS = { get:(k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } }, set:(k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };
const API = "https://kjlotlhqrgekzohshmbn.supabase.co/rest/v1/rpc/", CLE = "sb_publishable_1C-o-75sf7havBRmUWA8aQ_gcEW4sRY", te = new TextEncoder(), td = new TextDecoder();
const rpc = async (f, a) => { const r = await fetch(API + f, { method:"POST", headers:{ apikey:CLE, "Content-Type":"application/json" }, body:JSON.stringify(a || {}), cache:"no-store" }); if (!r.ok) throw new Error("Internet ne répond pas"); return r.json(); };
const hex = async s => [...new Uint8Array(await crypto.subtle.digest("SHA-256", te.encode(s)))].map(b => b.toString(16).padStart(2, "0")).join("");
const toast = t => { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); };
const argent = n => (Math.round((+n || 0) * 100) / 100).toLocaleString("fr-CA", { minimumFractionDigits:2, maximumFractionDigits:2 }) + " $";
const num = v => { const n = parseFloat(String(v ?? "").replace(/\s/g, "").replace(",", ".")); return isFinite(n) ? n : 0; };
const TPS = 0.05, TVQ = 0.09975;

/* ---------- la carte de l'élève (même entrée que le magasin) ---------- */
let K = LS.get("mpCarte", null), C = null;   /* C = { c:code, k:clé } */
function lireK(){ const m = K && String(K.c || "").match(/^MP-(\d{5})-([A-Z0-9]{4,12})$/); C = m ? { c:m[1], k:m[2] } : null; }
async function chercherCode(c){ const r = await rpc("carte_code_lire", { p_code:c }); if (!r || r.etat !== "ok") return r && r.etat === "bloque" ? "bloque" : null;
  const b = Uint8Array.from(atob(JSON.parse(r.data).d), x => x.charCodeAt(0)), k = await crypto.subtle.importKey("raw", await crypto.subtle.digest("SHA-256", te.encode("metier+|carte-code|" + c + "|cle")), "AES-GCM", false, ["decrypt"]);
  return JSON.parse(td.decode(await crypto.subtle.decrypt({ name:"AES-GCM", iv:b.slice(0, 12) }, k, b.slice(12)))); }
function entree(){ $("#barre").hidden = true; $("#qui").textContent = "";
  $("#app").innerHTML = `<h1>Facture au client</h1><p class="sous">Tape ton code à 5 chiffres (celui de ta carte).</p><div class="carte"><input class="code" id="cCode" inputmode="numeric" autocomplete="off" placeholder="00000" aria-label="Ton code"><p class="err" id="cErr"></p><button class="btn p" id="cOk">Entrer</button></div>`;
  const i = $("#cCode"), go = async () => { const c = i.value.trim(); if (!/^\d{5}$/.test(c)) { $("#cErr").textContent = "Écris ton code à 5 chiffres."; return; }
    $("#cErr").textContent = "Recherche…"; try { const o = await chercherCode(c);
      if (o === "bloque") { $("#cErr").textContent = "Trop d'essais en ce moment. Réessaie dans 10 minutes."; return; }
      if (!o) { $("#cErr").textContent = "Code inconnu. Vérifie avec ton enseignant."; return; }
      K = { c:o.c, g:o.g || "", p:o.p || "", t:Date.now() }; LS.set("mpCarte", K); lireK(); demarrer(); } catch(e){ $("#cErr").textContent = e.message; } };
  i.oninput = () => { if (/^\d{5}$/.test(i.value.trim())) go(); }; i.onkeydown = e => { if (e.key === "Enter") go(); }; $("#cOk").onclick = go; i.focus(); }

/* ---------- sauvegarde : sur l'appareil + copie chiffrée avec la clé de la carte ---------- */
let F = [];   /* factures */
const cleLocale = () => "factures|" + C.c;
async function cleAES(){ return crypto.subtle.importKey("raw", await crypto.subtle.digest("SHA-256", te.encode("metier+|factures-cle|" + C.c + "|" + C.k)), "AES-GCM", false, ["encrypt", "decrypt"]); }
async function charger(){ F = LS.get(cleLocale(), []);
  try { const r = await rpc("coffre_lire", { p_id:await hex("metier+|factures|" + C.c + "|" + C.k) }), row = r && r[0]; if (!row || !row.data) return;
    const b = Uint8Array.from(atob(JSON.parse(row.data).d), x => x.charCodeAt(0)), L = JSON.parse(td.decode(await crypto.subtle.decrypt({ name:"AES-GCM", iv:b.slice(0, 12) }, await cleAES(), b.slice(12))));
    const M = new Map(F.map(f => [f.id, f])); L.forEach(f => { const a = M.get(f.id); if (!a || (f.modif || 0) > (a.modif || 0)) M.set(f.id, f); }); F = [...M.values()].sort((a, b) => (b.modif || 0) - (a.modif || 0)); LS.set(cleLocale(), F); } catch(e){} }
let sauvT = 0;
function sauver(){ LS.set(cleLocale(), F); clearTimeout(sauvT); sauvT = setTimeout(async () => { try {
    const iv = crypto.getRandomValues(new Uint8Array(12)), ct = new Uint8Array(await crypto.subtle.encrypt({ name:"AES-GCM", iv }, await cleAES(), te.encode(JSON.stringify(F)))), u = new Uint8Array(12 + ct.length); u.set(iv); u.set(ct, 12);
    let s = ""; for (let i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768));
    await rpc("coffre_ecrire", { p_id:await hex("metier+|factures|" + C.c + "|" + C.k), p_jeton:await hex("metier+|factures-jeton|" + C.c + "|" + C.k), p_env:"public", p_data:JSON.stringify({ v:1, d:btoa(s) }) }); } catch(e){} }, 1500); }

/* 26 nov. (Jeremy : « les clients se rajoutent au hasard ») : client fictif tiré au hasard, comme un appel de service.
   Téléphones en 555 et courriels @exemple.com : jamais une vraie personne. */
const CLIENTS = { pre:["Sylvie","Martin","Nathalie","Éric","Isabelle","Stéphane","Julie","François","Caroline","Patrick","Annie","Mathieu","Josée","Sébastien","Mélanie","Daniel","Chantal","Alexandre","Geneviève","Luc","Marie-Ève","Guillaume","Véronique","Jean-François"],
  nom:["Bérubé","Ouellet","Pelletier","Lévesque","Dionne","Gagnon","Thériault","Michaud","Bélanger","Morin","Lavoie","Dubé","Saint-Pierre","Desjardins","Côté","Fortin","Lepage","Gauvin","Caron","Beaulieu","Roy","Bouchard","Sirois","Lebel"],
  rue:["rue des Érables","rue Lafontaine","boulevard Thériault","rue Fraser","rue Saint-Pierre","chemin des Raymond","rue de la Grève","avenue du Parc","rue Principale","rang Sainte-Anne","rue des Pins","rue Hayward"],
  ville:[["Rivière-du-Loup","G5R"],["Cacouna","G0L"],["Saint-Antonin","G0L"],["Notre-Dame-du-Portage","G0L"],["Trois-Pistoles","G0L"],["Saint-Pascal","G0L"],["Kamouraska","G0L"],["Saint-Alexandre-de-Kamouraska","G0L"],["L'Isle-Verte","G0L"],["Saint-Hubert-de-Rivière-du-Loup","G0L"]] };
function clientHasard(){ const h = a => a[Math.floor(Math.random() * a.length)], pr = h(CLIENTS.pre), no = h(CLIENTS.nom), v = h(CLIENTS.ville);
  const n = (Math.floor(Math.random() * 9) + 1) + "" + (Math.floor(Math.random() * 900) + 100), cp = v[1] + " " + Math.floor(Math.random() * 9) + "ABCEGHJKLMNPRSTVXY"[Math.floor(Math.random() * 18)] + Math.floor(Math.random() * 9);
  const sans = t => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z]/g, "");
  return { nom:pr + " " + no, adresse:n + ", " + h(CLIENTS.rue) + ", " + v[0] + " (Québec) " + cp, tel:"418 555-" + String(Math.floor(Math.random() * 10000)).padStart(4, "0"), courriel:sans(pr) + "." + sans(no) + "@exemple.com" }; }

/* 26 nov. (Jeremy : « il se décide un nom d'entreprise pour lui et son équipier de coffre ») : entreprise commune à l'équipe.
   Rangée partagée, trouvée et chiffrée avec les deux codes (les deux équipiers les connaissent). */
/* 26 nov. (Jeremy : « c'est à recommencer aux mêmes conditions que le coffre ») : l'entreprise suit le coffre de l'équipe
   (coffres publiés par l'enseignant : équipe = codes des élèves, « tour » augmenté au changement d'équipe ou à la fin de session).
   Nouveau tour = nouvelle entreprise. Sans coffre trouvé : code de l'équipier tapé à la main. */
let EQ = null;
async function trouverCoffre(){ try { const CP = (await (await fetch("comptes.json", { cache:"no-cache" })).json()).comptes || {};
    for (const ens of Object.keys(CP).filter(id => !CP[id].eleve)) { const r = await rpc("coffre_lire", { p_id:await hex("metier+|coffres-pub|" + ens) }), row = r && r[0]; if (!row || !row.data) continue;
      const o = JSON.parse(row.data); for (const [cid, cf] of Object.entries(o.cf || {})) if ((cf.eqc || []).includes(C.c)) { EQ = { ens, cid, tour:cf.tour || 0, nom:cf.nom || "", eq:cf.eqc.filter(x => x !== C.c) }; return; } } } catch(e){} }
const paire = () => { if (EQ) return "coffre|" + EQ.ens + "|" + EQ.cid + "|" + EQ.tour; const e = LS.get("equipier|" + C.c, ""); return /^\d{5}$/.test(e) && e !== C.c ? [C.c, e].sort().join("|") : ""; };
const entLS = () => "entreprise|" + (paire() || C.c);
async function entCle(pr){ return crypto.subtle.importKey("raw", await crypto.subtle.digest("SHA-256", te.encode("metier+|entreprise-cle|" + pr)), "AES-GCM", false, ["encrypt", "decrypt"]); }
async function entLire(){ const pr = paire(); if (!pr) return null; try { const r = await rpc("coffre_lire", { p_id:await hex("metier+|entreprise|" + pr) }), row = r && r[0]; if (!row || !row.data) return null;
  const b = Uint8Array.from(atob(JSON.parse(row.data).d), x => x.charCodeAt(0)); return JSON.parse(td.decode(await crypto.subtle.decrypt({ name:"AES-GCM", iv:b.slice(0, 12) }, await entCle(pr), b.slice(12)))); } catch(e){ return null; } }
async function entEcrire(ent){ const pr = paire(); LS.set(entLS(), ent); if (!pr) return; try {
  const iv = crypto.getRandomValues(new Uint8Array(12)), ct = new Uint8Array(await crypto.subtle.encrypt({ name:"AES-GCM", iv }, await entCle(pr), te.encode(JSON.stringify(Object.assign({}, ent, { t:Date.now() }))))), u = new Uint8Array(12 + ct.length); u.set(iv); u.set(ct, 12);
  await rpc("coffre_ecrire", { p_id:await hex("metier+|entreprise|" + pr), p_jeton:await hex("metier+|entreprise-jeton|" + pr), p_env:"public", p_data:JSON.stringify({ v:1, d:btoa(String.fromCharCode(...u)) }) }); } catch(e){} }
let ENT = null;   /* entreprise de l'équipe, la plus récente */
async function entSync(){ const e = await entLire(); if (e) { ENT = e; LS.set(entLS(), e); } else ENT = LS.get(entLS(), null); }

/* 26 nov. (Jeremy : « créer un logo fictif », « fais-en quelques-uns, ils vont choisir au début », « plus beau ») :
   6 logos dessinés (SVG) + 6 couleurs; l'équipe choisit, les initiales viennent du nom de l'entreprise */
const COULEURS = ["#1F5F8B", "#B83227", "#1E8E4E", "#D9601C", "#5B3A9A", "#22313F"], ICONES = ["goutte", "flamme", "cle", "maison", "raccord", "mono"];
const NOMS_LOGO = { goutte:"Goutte", flamme:"Flamme", cle:"Clé à tuyau", maison:"Maison", raccord:"Raccord", mono:"Initiales" };
const initiales = n => String(n || "").replace(/\b(inc|enr|ltée|ltee|senc|et|de|du|des|la|le|les)\b\.?/gi, " ").split(/[\s&-]+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "MP";
const fonce = (h, k) => "#" + [1, 3, 5].map(i => Math.round(parseInt(h.slice(i, i + 2), 16) * k).toString(16).padStart(2, "0")).join("");
function logoSVG(ent){ const c = COULEURS[+ent.coul || 0], d = fonce(c, 0.62), ic = ICONES.includes(ent.icone) ? ent.icone : "goutte", ini = esc(initiales(ent.nom)), id = "g" + (+ent.coul || 0) + ic;
  const grad = `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="${d}"/></linearGradient></defs>`, F = `fill="url(#${id})"`;
  const txt = (y, z, col) => `<text x="50" y="${y}" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-weight="800" font-size="${z}" fill="${col}" letter-spacing="1">${ini}</text>`;
  const corps = {
    goutte:`<circle cx="50" cy="50" r="47" ${F}/><circle cx="50" cy="50" r="41" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/><path d="M50 16C50 16 27 43 27 59a23 23 0 0 0 46 0C73 43 50 16 50 16z" fill="#fff"/>${txt(66, 17, c)}`,
    flamme:`<path d="M50 5L88 18v29c0 24-16 40-38 48C28 87 12 71 12 47V18z" ${F}/><path d="M50 12l31 11v24c0 20-13 33-31 40-18-7-31-20-31-40V23z" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/><path d="M50 22c9 13 20 21 18 37-1 12-9 19-18 19s-18-7-18-19c0-10 7-16 10-26 4 7 8 4 8-11z" fill="#fff"/><path d="M50 50c4 6 8 9 7 15-1 5-4 7-7 7s-7-3-7-7c0-5 4-8 7-15z" fill="${c}"/>`,
    cle:`<path d="M50 4l40 23v46L50 96 10 73V27z" ${F}/><path d="M50 11l34 19.5v39L50 89 16 69.5v-39z" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/><g transform="rotate(-40 50 50)" fill="#fff"><rect x="45" y="36" width="10" height="44" rx="4"/><path d="M38 20h26v9h-7v10H43v-6h-5z"/><rect x="40" y="31" width="20" height="5" rx="1.5" fill="${c}"/><rect x="47.5" y="66" width="5" height="10" rx="2" fill="${c}" opacity=".5"/></g>`,
    maison:`<rect x="3" y="3" width="94" height="94" rx="22" ${F}/><path d="M20 50L50 24l30 26" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 45v32h44V45" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round"/><path d="M50 49c0 0-9 11-9 17a9 9 0 0 0 18 0c0-6-9-17-9-17z" fill="#fff"/>`,
    raccord:`<circle cx="50" cy="50" r="47" ${F}/><circle cx="50" cy="50" r="41" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/><path d="M18 44h64M50 44v38" stroke="#fff" stroke-width="13" fill="none"/><g fill="#fff"><rect x="13" y="34" width="9" height="20" rx="2"/><rect x="78" y="34" width="9" height="20" rx="2"/><rect x="40" y="78" width="20" height="9" rx="2"/><rect x="38" y="32" width="24" height="24" rx="4"/></g><rect x="44" y="38" width="12" height="12" rx="2" fill="${c}"/>`,
    mono:`<rect x="3" y="3" width="94" height="94" rx="22" ${F}/>${txt(55, 32, "#fff")}<path d="M20 74h50a10 10 0 0 0 10-10v-2" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="75" y="57" width="10" height="7" rx="1.5" fill="#fff"/>` }[ic];
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">${grad}${corps}</svg>`; }
/* PNG pour le PDF */
function logoPNG(ent, z){ return new Promise(ok => { const im = new Image(), cv = document.createElement("canvas"); cv.width = cv.height = z;
  im.onload = () => { cv.getContext("2d").drawImage(im, 0, 0, z, z); ok(cv.toDataURL("image/png")); }; im.onerror = () => ok(null);
  im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(logoSVG(ent)); }); }

/* 26 nov. (Jeremy : « au début de la session il choisit et ça reste ») : l'équipe crée son entreprise une fois; ses factures la reprennent */
const ENT_VIDE = { nom:"", rbq:"", tps:"", tvq:"", tel:"", courriel:"", icone:"goutte", coul:0 };
function entreprise(retour){ const e = Object.assign({}, ENT_VIDE, ENT || {}); $("#barre").hidden = true; window.scrollTo(0, 0);
