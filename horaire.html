<style>
:root{--or:#EB6A22;--mar:#1E2A44;--f:#F6F3EE;--l:#E6E0D6;--ok:#1E8A55;--err:#C0392B;--gris:#6F6656}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,Segoe UI,Roboto,sans-serif;background:var(--f);color:var(--mar)}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:#fff;border-bottom:1px solid var(--l);position:sticky;top:0;z-index:20}
header img{height:26px}header h1{font-size:17px;margin:0;font-weight:600;color:var(--gris)}.esp{flex:1}
button,select,input{font:inherit;color:var(--mar)}button{background:#fff;border:1px solid var(--l);border-radius:10px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--or)}button.prim{background:var(--or);border-color:var(--or);color:#fff;font-weight:600}
select{border:1px solid var(--l);border-radius:10px;padding:8px 10px;background:#fff}
main{padding:16px 20px 60px}
.haut{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--l);border-radius:10px;overflow:hidden}.seg button{border:0;border-radius:0}.seg button.on{background:var(--mar);color:#fff}
.etat{padding:7px 14px;border-radius:99px;font-weight:600;font-size:13px}.etat.ok{background:#E3F4EA;color:var(--ok)}.etat.err{background:#FBE3E0;color:var(--err);cursor:pointer}
.legende{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.lp{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid transparent;border-radius:99px;padding:5px 12px 5px 6px;cursor:pointer;font-size:13px}
.lp i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 10px system-ui;font-style:normal}.lp b{font-weight:600}.lp span{color:var(--gris)}
.lp.on{border-color:var(--mar)}
.carte{background:#fff;border:1px solid var(--l);border-radius:14px;overflow:auto;max-height:calc(100vh - 250px)}
table{border-collapse:separate;border-spacing:0}
th,td{border-bottom:1px solid #F0EBE3;padding:0}
thead th{position:sticky;top:0;background:#fff;z-index:3;font-size:11px;color:var(--gris);font-weight:600;padding:8px 2px 6px;border-bottom:1px solid var(--l);min-width:52px}
thead th.mois{color:var(--mar)}
th.nom,td.nom{position:sticky;left:0;background:#fff;z-index:2;text-align:left;padding:6px 12px;min-width:210px;max-width:230px;border-right:1px solid var(--l)}
thead th.nom{z-index:4}
td.nom b{display:block;font-size:13px}td.nom small{color:var(--gris);font-size:11px}
.barre{height:6px;background:#EEE9E1;border-radius:9px;margin-top:5px;overflow:hidden}.barre i{display:block;height:100%;background:var(--ok)}
.barre.trop i{background:var(--err)}.barre.manque i{background:var(--or)}
td.c{height:46px;text-align:center;cursor:pointer;vertical-align:middle;border-left:1px solid #F5F1EB}
td.c:hover{background:#FFF6EF}
.puce{display:inline-block;min-width:24px;padding:3px 5px;margin:1px;border-radius:7px;color:#fff;font:700 12px system-ui}
tr.autre td.nom b{color:var(--gris);font-weight:600}tr.autre .puce{background:#B8AFA2!important}
tr.sep td{background:#FBF9F5;font-size:11px;color:var(--gris);padding:6px 12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
tfoot td{position:sticky;bottom:0;background:#FBF9F5;z-index:2;border-top:1px solid var(--l);text-align:center;font-size:11px;padding:6px 2px}
tfoot td.nom{background:#FBF9F5}

.w-trop{color:var(--err);font-weight:700}.w-trop .jauge i{background:var(--err)}.w-manque .jauge i{background:var(--or)}
thead th.conf{background:#FBE3E0;color:var(--err)}
.dim .puce{opacity:.18}.dim .puce.vu{opacity:1;outline:2px solid var(--mar)}

  const ligne = m => { const k = m.k, fait = s.sem.reduce((a, w, wi) => a + totalCase(s, wi, k), 0), pct = m.h ? Math.min(100, fait / m.h * 100) : 0, cl = !m.h ? "" : fait > m.h ? "trop" : fait < m.h ? "manque" : "";
    if (!m.autre && fait !== m.h) prob.push(`${m.titre} : ${fait} h placées sur ${m.h} h`);
    let r = `<tr class="${m.autre ? "autre" : ""}"><td class="nom"><b>${m.num ? m.num + " · " : ""}${m.titre}</b><small>${m.code ? m.code + " · " : ""}${fait} / ${m.h} h${m.ev ? " · éval " + m.ev + " h" : ""}${cl === "" && m.h && !m.autre ? " ✓" : ""}</small>${m.autre ? "" : `<div class="barre ${cl}"><i style="width:${pct}%"></i></div>`}</td>`;
    s.sem.forEach((w, wi) => { const c = cell(s, wi, k);
      r += `<td class="c" data-w="${wi}" data-k="${k}">` + Object.keys(c).map(p => `<span class="puce ${FILTRE === p ? "vu" : ""}" style="background:${couleur(p)}" title="${D.profs[p] || "Non assigné"}">${c[p]}</span>`).join("") + `</td>`; });
    return r + `</tr>`; };
  s.mods.filter(m => !m.autre).forEach(m => h += ligne(m));
  if (s.mods.some(m => m.autre)) { h += `<tr class="sep"><td class="nom">Autres activités</td><td colspan="${s.sem.length}"></td></tr>`; s.mods.filter(m => m.autre).forEach(m => h += ligne(m)); }
  h += `</tbody><tfoot><tr><td class="nom"><b>Heures de la semaine</b></td>`;
  s.sem.forEach((w, wi) => { const t = s.mods.reduce((a, m) => a + (m.autre ? 0 : totalCase(s, wi, m.k)), 0), cl = t > w.h ? "w-trop" : t < w.h ? "w-manque" : "";
    if (t > w.h) prob.push(`Semaine du ${jm(w.d)} : ${t} h placées pour ${w.h} h`);
    h += `<td class="${cl}"><div class="jauge"><i style="height:${Math.min(100, w.h ? t / w.h * 100 : 0)}%"></i></div>${t}/${w.h}</td>`; });
  h += `</tr></tfoot></table>`;
  $("#vue").innerHTML = h;
  // conflits entre groupes
  Object.keys(C).forEach(p => Object.keys(C[p]).forEach(d => { const e = C[p][d]; if (e.h > e.max && s.sem.some(w => w.d === d)) prob.push(`${D.profs[p] || p} : ${e.h} h la semaine du ${jm(d)} (${[...e.grp].join(", ")})`); }));
  const P = [...new Set(prob)];
  $("#etat").className = "etat " + (P.length ? "err" : "ok"); $("#etat").textContent = P.length ? P.length + " point" + (P.length > 1 ? "s" : "") + " à régler" : "Tout est correct";
  $("#alertes").innerHTML = $("#alertes").dataset.ouv ? P.map(a => `<div class="alert">${a}</div>`).join("") : "";
}

/* petite fenêtre d'une case : heures de chaque enseignant, − / + */
function ouvrirCase(td){
  const s = ses(), wi = +td.dataset.w, k = td.dataset.k, m = s.mods.find(x => x.k === k), w = s.sem[wi], c = cell(s, wi, k);
  const liste = [...new Set([...(m.profs || []), ...Object.keys(c)])];
  if (!liste.length) liste.push(m.autre ? "-" : Object.keys(D.profs)[0]);
  const pop = $("#pop"), place = s.mods.reduce((a, x) => a + (x.autre ? 0 : totalCase(s, wi, x.k)), 0);
  pop.innerHTML = `<h3>${m.titre}</h3><div class="s">Semaine du ${jm(w.d)} · ${place} h placées sur ${w.h}</div>` +
    liste.map(p => `<div class="lg"><i style="background:${p === "-" ? "#B8AFA2" : couleur(p)}">${p === "-" ? "" : p}</i><span class="n">${p === "-" ? "Heures" : D.profs[p] || p}</span><button data-d="-1" data-p="${p}">−</button><output>${c[p] || 0}</output><button data-d="1" data-p="${p}">+</button></div>`).join("") +
    (m.autre ? "" : `<div class="ajout">${Object.keys(D.profs).filter(p => !liste.includes(p)).map(p => `<button data-aj="${p}">+ ${D.profs[p]}</button>`).join("")}</div>`) +
    `<div class="bas"><span>Reste à placer : ${Math.max(0, m.h - s.sem.reduce((a, x, i) => a + totalCase(s, i, k), 0))} h</span><button data-fermer>OK</button></div>`;
  pop.hidden = false; const r = td.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(innerWidth - pw - 8, r.left + r.width / 2 - pw / 2)) + "px";
  pop.style.top = (r.bottom + ph + 10 < innerHeight ? r.bottom + 6 : Math.max(8, r.top - ph - 6)) + "px";
  pop.onclick = e => { const b = e.target.closest("button"); if (!b) return; e.stopPropagation();
    if (b.dataset.fermer != null){ pop.hidden = true; return; }
    if (b.dataset.aj){ if (!m.profs.includes(b.dataset.aj)) m.profs.push(b.dataset.aj); sauver(); ouvrirCase(td); return; }
    const p = b.dataset.p, v = Math.max(0, (c[p] || 0) + (+b.dataset.d)); fixer(s, wi, k, p, v); sauver(); dessiner();
    ouvrirCase(document.querySelector(`td.c[data-w="${wi}"][data-k="${CSS.escape(k)}"]`)); };
}
document.addEventListener("click", e => {
  const td = e.target.closest("td.c"); if (td){ ouvrirCase(td); return; }
  if (!e.target.closest("#pop")) $("#pop").hidden = true;
  const sb = e.target.closest("[data-s]"); if (sb){ S = +sb.dataset.s; dessiner(); }
  const f = e.target.closest("[data-f]"); if (f){ FILTRE = FILTRE === f.dataset.f ? null : f.dataset.f; dessiner(); }
  if (e.target.closest("#etat")){ const a = $("#alertes"); a.dataset.ouv = a.dataset.ouv ? "" : "1"; dessiner(); }
  const mb = e.target.closest("#bMenu"); $("#menu").classList.toggle("ouv", !!mb && !$("#menu").classList.contains("ouv"));
  const a = e.target.closest("[data-a]"); if (a) action(a.dataset.a);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#pop").hidden = true; });
$("#gSel").onchange = e => { G = +e.target.value; S = 0; dessiner(); };

function action(a){ const s = ses();
  if (a === "print") print();
  if (a === "auto"){ if (Object.keys(s.g).length && !confirm("Remplacer les heures déjà placées dans cette session ?")) return; remplir(s); }
  if (a === "tach") taches();
  if (a === "mods") editer();
  if (a === "grp") nouveauGroupe();
  if (a === "exp"){ const l = document.createElement("a"); l.href = URL.createObjectURL(new Blob([JSON.stringify(D)], { type:"application/json" })); l.download = "horaires-" + new Date().toISOString().slice(0, 10) + ".json"; l.click(); }
  if (a === "imp"){ const i = document.createElement("input"); i.type = "file"; i.accept = ".json"; i.onchange = async () => { try { D = JSON.parse(await i.files[0].text()); G = S = 0; sauver(); dessiner(); } catch(x){ alert("Fichier illisible."); } }; i.click(); }
  if (a === "raz" && confirm("Effacer tout et reprendre l'exemple (2026EGI1) ?")){ D = JSON.parse(JSON.stringify(EXEMPLE)); G = S = 0; sauver(); dessiner(); }
}
/* remplissage simple : modules dans l'ordre, au 1er enseignant, en respectant ses heures dans les autres groupes */
function remplir(s){ s.g = {}; const C = charges(); const L = s.mods.filter(m => !m.autre && m.h); let i = 0, reste = L.length ? L[0].h : 0;
  s.sem.forEach((w, wi) => { let cap = w.h, garde = 0;
    while (cap > 0 && i < L.length && garde++ < 50){ const m = L[i], p = m.profs.find(q => !(C[q] && C[q][w.d] && C[q][w.d].h >= C[q][w.d].max)) || m.profs[0] || "-";
      const v = Math.min(cap, reste); fixer(s, wi, m.k, p, (cell(s, wi, m.k)[p] || 0) + v); cap -= v; reste -= v; if (reste <= 0){ i++; reste = i < L.length ? L[i].h : 0; } } });
  sauver(); dessiner(); }
function nouveauGroupe(){ const nom = prompt("Nom du groupe (ex. 2027EGI1) :"); if (!nom) return;
  const debut = prompt("Lundi de la 1re semaine (AAAA-MM-JJ) :", new Date().toISOString().slice(0, 10)); if (!debut) return;
  const c = JSON.parse(JSON.stringify(grp())); c.id = "g" + Date.now(); c.nom = nom;
  const d0 = dt(c.sessions[0].sem[0].d), d1 = dt(debut), dec = Math.round((d1 - d0) / 6048e5) * 7;
  c.sessions.forEach(s => { s.g = {}; s.sem.forEach(w => { const x = dt(w.d); x.setDate(x.getDate() + dec); w.d = x.toISOString().slice(0, 10); }); });
  D.groupes.push(c); G = D.groupes.length - 1; S = 0; remplir(ses()); S = 1; if (ses()) remplir(ses()); S = 0; sauver(); dessiner();
  alert("Groupe créé avec les mêmes modules et semaines décalées. Vérifie les congés dans « Modules, enseignants et semaines »."); }

function taches(){ const g = grp(); g.taches = g.taches || {}; const T = {};
  g.sessions.slice(0, 2).forEach((s, si) => { s.sem.forEach((w, wi) => { const W = s.g[wi] || {}; for (const k in W){ const m = s.mods.find(x => x.k === k); if (!m || m.autre) continue; for (const p in W[k]) if (p !== "-") ((T[p] = T[p] || { reg:[0,0], ev:[0,0] }).reg[si] += W[k][p]); } });
    s.mods.forEach(m => { const p = m.profs[0]; if (p && m.ev) (T[p] = T[p] || { reg:[0,0], ev:[0,0] }).ev[si] += m.ev; }); });
  const M = ["cg|Chef de groupe", "st|Stages", "rep|Examen reprise", "aut|Autres"];
  let h = `<h2 style="margin-top:0">Tâches annuelles · ${g.nom}</h2><table class="t"><tr><th rowspan="2">Enseignant</th><th colspan="2">Tâche régulière</th><th colspan="2">Évaluation</th>` + M.map(x => `<th colspan="2">${x.split("|")[1]}</th>`).join("") + `<th colspan="2">Total</th><th rowspan="2">Année</th></tr><tr>` + "<th>S1</th><th>S2</th>".repeat(7) + `</tr>`;
  let tt = 0; Object.keys(D.profs).forEach(p => { const t = T[p] || { reg:[0,0], ev:[0,0] }, x = g.taches[p] = g.taches[p] || {}, s1 = [0, 0];
    h += `<tr><td style="text-align:left"><b>${D.profs[p]}</b></td>` + ["reg", "ev"].map(k => [0, 1].map(i => { s1[i] += t[k][i]; return `<td>${t[k][i] || ""}</td>`; }).join("")).join("") +
      M.map(c => { const k = c.split("|")[0]; return [0, 1].map(i => { const v = +((x[k] || [])[i] || 0); s1[i] += v; return `<td><input data-t="${p}|${k}|${i}" value="${v || ""}"></td>`; }).join(""); }).join("") +
      `<td><b>${s1[0]}</b></td><td><b>${s1[1]}</b></td><td><b>${s1[0] + s1[1]}</b></td></tr>`; tt += s1[0] + s1[1]; });
  h += `<tr><td colspan="15" style="text-align:right"><b>Total de l'année</b></td><td><b>${tt}</b></td></tr></table><p class="mini">Tâche régulière et évaluation (au 1er enseignant du module) viennent de l'horaire. Les autres colonnes s'écrivent à la main (ex. stage coupé : −30).</p><p><button onclick="print()">Imprimer</button></p>`;
  $("#dlgC").innerHTML = h; if (!dlg.open) dlg.showModal();
  $("#dlgC").onchange = e => { const t = e.target.dataset.t; if (!t) return; const [p, k, i] = t.split("|"), x = g.taches[p]; x[k] = x[k] || [0, 0]; x[k][+i] = Math.round(+e.target.value.replace(",", ".") || 0); sauver(); taches(); };
}
function editer(){ const s = ses();
  $("#dlgC").innerHTML = `<h2 style="margin-top:0">${grp().nom} · ${s.nom}</h2>
  <p class="mini"><b>Modules</b>, un par ligne, dans l'ordre : numéro ; code ; titre ; heures ; heures d'évaluation ; enseignants (initiales, le 1er = responsable). Une ligne sans code = autre activité (férié, plage verte…).</p>
  <textarea id="tM">${s.mods.map(m => [m.num || "", m.code, m.titre, m.h, m.ev || 0, m.profs.join(",")].join(" ; ")).join("\n")}</textarea>
  <p class="mini"><b>Semaines</b> : lundi (AAAA-MM-JJ) ; heures. Enlève une semaine de congé ou change ses heures.</p>
  <textarea id="tS" style="min-height:120px">${s.sem.map(w => w.d + " ; " + w.h).join("\n")}</textarea>
  <p class="mini"><b>Enseignants</b> : initiales ; nom.</p>
  <textarea id="tP" style="min-height:90px">${Object.entries(D.profs).map(([k, v]) => k + " ; " + v).join("\n")}</textarea>
  <p class="mini">Nom du groupe : <input id="tG" value="${grp().nom}" style="border:1px solid var(--l);border-radius:8px;padding:6px"></p>
  <p><button class="prim" id="okM">Enregistrer</button></p>`;
  dlg.showModal();
  $("#okM").onclick = () => { const L = t => $(t).value.split("\n").map(l => l.split(";").map(x => x.trim())).filter(x => x.some(Boolean));
    D.profs = Object.fromEntries(L("#tP").map(x => [x[0], x[1] || x[0]]));
    const vieux = s.mods; s.mods = L("#tM").map(x => { const code = x[1] || "", titre = x[2] || "", k = code || (vieux.find(v => v.titre === titre) || {}).k || titre;
      return { k, code, titre, num:+x[0] || 0, h:+x[3] || 0, ev:+x[4] || 0, profs:(x[5] || "").split(",").map(y => y.trim()).filter(Boolean), autre:!code }; });
    s.sem = L("#tS").map(x => ({ d:x[0], h:+x[1] || 0 })); grp().nom = $("#tG").value.trim() || grp().nom; sauver(); dlg.close(); dessiner(); }; }
dessiner();
</script>
