# Copie de sauvegarde de la base Supabase (25 nov.) : le forfait gratuit n'en fait aucune.
# Chaque dimanche, toutes les tables sont copiées, chiffrées avec le mot de passe de Jeremy, puis gardées 90 jours
# dans les « Artifacts » de cette tâche (Actions → Sauvegarde Supabase → une exécution → sauvegarde-…).
# Un seul secret (Settings → Secrets and variables → Actions) : SAUVEGARDE_MDP = mot de passe de Jeremy (le garder : il ouvre la sauvegarde).
# La base vérifie ce mot de passe (fonction sauvegarde_lire, outils/sauvegarde.sql : seule son empreinte est gardée dans Supabase).
# Ouvrir une sauvegarde : openssl enc -d -aes-256-cbc -pbkdf2 -in sauvegarde.tar.gz.enc -out sauvegarde.tar.gz
name: Sauvegarde Supabase
on:
  schedule:
    - cron: "41 7 * * 0"     # dimanche, 2 h 41 (heure de l'Est)
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    steps:
      - name: Copier les tables
        env:
          MDP: ${{ secrets.SAUVEGARDE_MDP }}
        run: |
          if [ -z "$MDP" ]; then echo "Il manque le secret SAUVEGARDE_MDP (voir le haut de ce fichier)."; exit 1; fi
          URL="https://nhxhfiaznuifcbobjuuv.supabase.co/rest/v1/rpc/sauvegarde_lire"
          PUB="sb_publishable_GwzHRE-rG-rVafG7QcTOxg_S68OQHXh"
          mkdir -p sauvegarde
          for t in coffre stats journal; do
            : > "sauvegarde/$t.jsonl"; n=0; d=0
            while :; do
              jq -n --arg m "$MDP" --arg t "$t" --argjson d "$d" '{p_mdp:$m, p_table:$t, p_depart:$d}' > req.json
              code=$(curl -s -o page.json -w "%{http_code}" -X POST "$URL" -H "apikey: $PUB" -H "Content-Type: application/json" --data @req.json)
              if [ "$code" != "200" ] || [ "$(jq -r 'type' page.json)" != "array" ]; then echo "$t : refusé (HTTP $code; mot de passe ou fonction sauvegarde_lire)"; exit 1; fi
              k=$(jq length page.json); [ "$k" = "0" ] && break
              jq -c '.[]' page.json >> "sauvegarde/$t.jsonl"; n=$((n + k)); d=$((d + k))
            done
            echo "$t : $n rangées"
          done
          date -u +"%Y-%m-%dT%H:%MZ" > sauvegarde/date.txt
          tar czf sauvegarde.tar.gz sauvegarde
          openssl enc -aes-256-cbc -pbkdf2 -salt -in sauvegarde.tar.gz -out sauvegarde.tar.gz.enc -pass env:MDP
          rm -rf sauvegarde sauvegarde.tar.gz page.json req.json
      - uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-${{ github.run_number }}
          path: sauvegarde.tar.gz.enc
          retention-days: 90
