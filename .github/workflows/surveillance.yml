# Surveillance (25 nov.) : toutes les 30 minutes, le site et Supabase répondent-ils ?
# En cas de panne : avis « Panne Métier+ » dans les signalements (boîte au Canada, avis sur le cellulaire) + exécution en rouge dans Actions.
# Au plus un avis par panne : l'avis n'est pas renvoyé tant que la panne dure (fichier gardé en cache).
name: Surveillance du site
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: etat-panne.txt
          key: etat-panne-${{ github.run_id }}
          restore-keys: etat-panne-
      - name: Vérifier
        run: |
          pannes=""
          for i in 1 2 3; do   # 3 essais espacés : une seconde de lenteur n'est pas une panne
            pannes=""
            c=$(curl -s -o site.html -w "%{http_code}" -m 20 https://metierplus.app/)
            if [ "$c" != "200" ] || ! grep -q "Métier" site.html; then pannes="$pannes site (HTTP $c);"; fi
            c=$(curl -s -o /dev/null -w "%{http_code}" -m 20 "https://nhxhfiaznuifcbobjuuv.supabase.co/rest/v1/rpc/journal_lire?p_heures=1" -H "apikey: sb_publishable_GwzHRE-rG-rVafG7QcTOxg_S68OQHXh")
            if [ "$c" != "200" ]; then pannes="$pannes Supabase (HTTP $c);"; fi
            [ -z "$pannes" ] && break; sleep 60
          done
          avant=$(cat etat-panne.txt 2>/dev/null || echo "ok")
          if [ -n "$pannes" ]; then
            echo "Panne :$pannes"
            if [ "$avant" = "ok" ]; then
              # 27 nov. (Loi 25) : boîte au Canada (plus ntfy.sh); si Supabase est en panne, l'exécution rouge dans Actions avertit quand même
              curl -s -X POST "https://nhxhfiaznuifcbobjuuv.supabase.co/rest/v1/rpc/boite_poster" -H "apikey: sb_publishable_GwzHRE-rG-rVafG7QcTOxg_S68OQHXh" -H "Content-Type: application/json" -d "{\"p_sujet\":\"metierplus-signal-f3ce60fd2f6c0f46\",\"p_titre\":\"Panne Métier+\",\"p_prio\":4,\"p_tags\":\"warning\",\"p_corps\":\"Ne répond pas :$pannes Vérifié 3 fois en 2 minutes à $(TZ=America/Toronto date '+%H h %M').\"}" >/dev/null
            fi
            echo "panne" > etat-panne.txt; echo "PANNE=1" >> $GITHUB_ENV
          else
            if [ "$avant" = "panne" ]; then curl -s -X POST "https://nhxhfiaznuifcbobjuuv.supabase.co/rest/v1/rpc/boite_poster" -H "apikey: sb_publishable_GwzHRE-rG-rVafG7QcTOxg_S68OQHXh" -H "Content-Type: application/json" -d "{\"p_sujet\":\"metierplus-signal-f3ce60fd2f6c0f46\",\"p_titre\":\"Métier+ fonctionne de nouveau\",\"p_tags\":\"white_check_mark\",\"p_corps\":\"Le site et Supabase répondent de nouveau ($(TZ=America/Toronto date '+%H h %M')).\"}" >/dev/null; fi
            echo "ok" > etat-panne.txt; echo "Tout répond."
          fi
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: etat-panne.txt
          key: etat-panne-${{ github.run_id }}
      - name: Marquer la panne en rouge
        if: env.PANNE == '1'
        run: exit 1
