# Garde le projet Supabase du Labo interactif éveillé.
# Supabase (gratuit) met un projet en pause après 7 jours sans activité;
# cette tâche lui envoie une petite demande tous les 3 jours.
name: Réveil Supabase (Labo)
on:
  schedule:
    - cron: "17 9 */3 * *"   # tous les 3 jours, 4 h 17 (heure de l'Est)
  workflow_dispatch: {}      # bouton « Run workflow » pour l'essayer à la main
permissions:
  contents: write
jobs:
  reveil:
    runs-on: ubuntu-latest
    steps:
      - name: Demande à la base de données
        run: |
          URL="https://kjlotlhqrgekzohshmbn.supabase.co"
          CLE="sb_publishable_1C-o-75sf7havBRmUWA8aQ_gcEW4sRY"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/reveil?select=id&limit=1" -H "apikey: $CLE")
          echo "Base de données : HTTP $code"
          code2=$(curl -s -o /dev/null -w "%{http_code}" "$URL/auth/v1/health" -H "apikey: $CLE")
          echo "Service : HTTP $code2"
          if [ "$code" = "000" ] && [ "$code2" = "000" ]; then echo "Supabase injoignable"; exit 1; fi
      - uses: actions/checkout@v4
      - name: Garder le dépôt actif (GitHub arrête les tâches planifiées après 60 jours sans changement)
        run: |
          dernier=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - dernier )) -gt $(( 40 * 86400 )) ]; then
            date -u +"%Y-%m-%d" > .github/derniere-visite.txt
            git config user.name "reveil-automatique"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/derniere-visite.txt
            git commit -m "Réveil automatique : dépôt gardé actif"
            git push
          else
            echo "Dépôt modifié il y a moins de 40 jours : rien à faire."
          fi
