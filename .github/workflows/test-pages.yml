# Test après chaque publication (25 nov.) : les pages principales s'ouvrent-elles sans erreur, à l'ordinateur et au cellulaire ?
# Un échec envoie un courriel de GitHub à Jeremy. Détails : Actions → Test des pages → l'exécution en rouge.
name: Test des pages
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: test-pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer Playwright
        run: |
          cd /tmp && npm init -y >/dev/null && npm i playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Ouvrir les pages
        run: |
          python3 -m http.server 8791 >/dev/null 2>&1 &
          sleep 1
          NODE_PATH=/tmp/node_modules node outils/tests/pages.js
