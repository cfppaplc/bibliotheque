<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ma carte Métier+</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1E2A44">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ma carte">
<link rel="manifest" href="carte.webmanifest"><link rel="apple-touch-icon" href="img/carte-180.png">
<style>
/* © 2026 Jérémy Raymond. Tous droits réservés. Métier+ — « Ma carte Métier+ » (25 nov.) : la carte de l'élève sur son cellulaire, même sans Internet.
   La carte arrive par le code QR de sa fiche (carte.html#c=MP-123-K7Q9X2&g=…&p=…) : le # n'est jamais envoyé au serveur; tout reste sur le cellulaire. */
[hidden]{display:none!important}*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#1E2A44;color:#fff;font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:460px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.tete{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.tete img{height:30px}.tete span{font-size:.8rem;opacity:.75;text-transform:uppercase;letter-spacing:.08em}
.carte{background:#fff;color:#1E2A44;border-radius:22px;padding:22px 20px 18px;box-shadow:0 18px 40px rgba(0,0,0,.35);text-align:center}
.carte .g{font-size:.85rem;color:#6b7280;text-transform:uppercase;letter-spacing:.06em}.carte .p{font-size:1.5rem;font-weight:800;margin:2px 0 6px}
.carte .n{font:900 3.4rem/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;margin:6px 0 12px;color:#EB6A22}
.carte img.cb{width:100%;height:110px;image-rendering:pixelated;display:block}
.carte .qr{display:inline-block;margin-top:14px}.carte small{display:block;color:#6b7280;margin-top:8px;font-size:.78rem}
.aide{margin-top:18px;background:rgba(255,255,255,.08);border-radius:16px;padding:14px 16px;font-size:.92rem}.aide b{color:#FFB15C}
.btn{display:block;width:100%;min-height:50px;margin-top:12px;border-radius:14px;border:0;background:#EB6A22;color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;text-align:center;line-height:50px}
.btn.s{background:transparent;border:1px solid rgba(255,255,255,.35)}
input{width:100%;min-height:52px;border-radius:14px;border:0;padding:0 14px;font:700 1.2rem ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase}
.err{color:#ffb0a8;min-height:1.3em}
/* même entrée que le magasin de raccords */
.sous{opacity:.85}.boite{background:#fff;color:#1E2A44;border-radius:16px;padding:16px 18px}.boite label{display:block;font-weight:600;margin-top:6px}.boite .err{color:#b42318}
input.code{display:block;font:800 2.6rem/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.25em;text-align:center;padding:16px;border-radius:16px;border:2px solid #d5dae3;margin:4px 0 10px;min-height:0}
input.pre{border:2px solid #d5dae3;font:400 1.15rem system-ui,-apple-system,sans-serif;text-transform:none;padding:0 16px}
.carte.cachee{cursor:pointer}.carte.cachee img.cb,.carte.cachee .qr{filter:blur(14px);opacity:.35}
.carte.cachee small::before{content:"Touche la carte pour l'afficher 10 secondes. ";display:block;font-weight:700;color:#EB6A22;margin-bottom:4px}
</style>
<script src="js/session-dep.js?v=5"></script>
</head>
<body>
<main>
  <div class="tete"><img src="img/metier-plus-blanc.svg" alt="Métier+"><span>Carte de l'élève</span></div>
  <div id="vide" hidden>
    <h1 style="font-size:1.4rem">Ma carte Métier+</h1>
    <p class="sous">Tape ton code à 5 chiffres. Ta carte reste ensuite sur ton cellulaire.</p>
    <div class="boite"><input class="code" id="cle" inputmode="numeric" autocomplete="off" autocapitalize="characters" placeholder="00000" aria-label="Ton code">
    <p class="err" id="err"></p>
    <button class="btn" id="ok">Afficher ma carte</button></div>
    <p style="opacity:.75;font-size:.85rem;margin-top:14px">Tu peux aussi scanner le code QR de ta fiche « Ma carte » avec l'appareil photo.</p>
  </div>
  <div id="vue" hidden>
    <div class="carte"><div class="g" id="vG"></div><div class="p" id="vP"></div><div class="n" id="vN"></div><img class="cb" id="vCb" alt=""><div class="qr" id="vQr"></div><small>Montre cette carte au magasin, aux coffres et pour tes livres.</small></div>
    <div class="aide" id="aide"></div>
    <div id="bBoutons" style="display:grid;grid-template-columns:1fr;gap:10px"><a class="btn" href="magasin.html" style="margin-top:12px">Magasin</a><a class="btn" href="facture.html" id="bFac" hidden style="margin-top:12px">Facture</a></div>
    <button class="btn s" id="oublier">Ce n'est pas ma carte</button>
  </div>
</main>
<script src="js/qrcode.js"></script><script src="js/code128.js?v=1"></script>
<script>
"use strict";
const $ = s => document.querySelector(s), LS = { get:k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch(e){ return null; } }, set:(k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };
/* Chrome, Samsung Internet, Edge… proposent l'installation directe : on garde l'occasion pour un bouton */
let INSTALLER = null; addEventListener("beforeinstallprompt", e => { e.preventDefault(); INSTALLER = e; try { afficher(); } catch(x){} });
const valide = c => /^MP-\d{3,5}-[A-Z0-9]{4,12}$/.test(c);
/* carte reçue par le code QR (#c=…&g=…&p=…) : gardée, puis le # est effacé de l'adresse */
(() => { const h = new URLSearchParams(location.hash.slice(1)), c = (h.get("c") || "").toUpperCase();
  if (valide(c)) { LS.set("mpCarte", { c, g:h.get("g") || "", p:(h.get("p") || "").split(/\s+/)[0].slice(0, 30), t:Date.now() }); history.replaceState(null, "", location.pathname); } })();
/* carte sans prénom (entrée avec l'ancienne clé complète) : le prénom vient de la fiche de l'élève, publiée par le registre */
async function chercherCode(c){ const te = new TextEncoder(), base = "metier+|carte-code|" + c;
  const r = await (await fetch("https://kjlotlhqrgekzohshmbn.supabase.co/rest/v1/rpc/carte_code_lire", { method:"POST", headers:{ apikey:"sb_publishable_1C-o-75sf7havBRmUWA8aQ_gcEW4sRY", "Content-Type":"application/json" }, body:JSON.stringify({ p_code:c }) })).json();
  if (!r || r.etat !== "ok") return r && r.etat === "bloque" ? "bloque" : null;
  const b = Uint8Array.from(atob(JSON.parse(r.data).d), x => x.charCodeAt(0)), cle = await crypto.subtle.importKey("raw", await crypto.subtle.digest("SHA-256", te.encode(base + "|cle")), "AES-GCM", false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name:"AES-GCM", iv:b.slice(0, 12) }, cle, b.slice(12)))); }
let PRENOM_FAIT = false;
async function completerPrenom(K){ if (PRENOM_FAIT || !K || !K.c || K.p) return; PRENOM_FAIT = true; const m = K.c.match(/^MP-(\d{5})-/); if (!m) return;
  try { const o = await chercherCode(m[1]); if (o && o.c === K.c && o.p) { K.p = o.p; K.g = K.g || o.g || ""; LS.set("mpCarte", K); afficher(); } } catch(e){} }
let montreT = 0;
function cacher(code){ clearTimeout(montreT); const v = $("#vue .carte"); v.classList.add("cachee"); $("#vN").textContent = "•••••";
  v.onclick = () => { if (!v.classList.contains("cachee")) return; v.classList.remove("cachee"); $("#vN").textContent = code; montreT = setTimeout(() => cacher(code), 10000); }; }
function afficher(){
  const K = LS.get("mpCarte"); $("#vide").hidden = !!K; $("#vue").hidden = !K; if (!K) { $("#cle").focus(); return; }
  const code = K.c.split("-")[1];
  $("#vG").textContent = K.g || "Métier+"; $("#vP").textContent = K.p || ""; completerPrenom(K); factureOuverte(K.g).then(ok => { $("#bFac").hidden = !ok; $("#bBoutons").style.gridTemplateColumns = ok ? "1fr 1fr" : "1fr"; }); $("#vN").textContent = code;
  $("#vCb").src = Code128.url(K.c, 60, false); $("#vCb").alt = K.c;
  const M = QRLib.matrice(K.c), k = M.length;
  $("#vQr").innerHTML = `<svg viewBox="0 0 ${k + 8} ${k + 8}" width="150" height="150"><rect width="${k + 8}" height="${k + 8}" fill="#fff"/>${M.map((r, y) => r.map((v, x) => v ? `<rect x="${x + 4}" y="${y + 4}" width="1.02" height="1.02"/>` : "").join("")).join("")}</svg>`;
  /* 26 nov. (Jeremy : « caché pour tous; quand on clique, ça le montre 10 s ») : numéro, code-barres et QR masqués; un toucher les montre 10 secondes */
  cacher(code);
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent), installe = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  $("#aide").innerHTML = installe ? `<b>Astuce :</b> monte la luminosité de ton écran si le lecteur a de la difficulté à lire ta carte.`
    : ios ? `<b>Garde ta carte sur ton cellulaire :</b> touche <b>Partager</b> (le carré avec la flèche), puis <b>« Sur l'écran d'accueil »</b>. Elle s'ouvrira même sans Internet.`
    : `<b>Garde ta carte sur ton cellulaire :</b> ouvre le menu de ton navigateur (⋮ ou ≡, en haut ou en bas de l'écran), puis <b>« Ajouter à l'écran d'accueil »</b> ou <b>« Installer »</b>. Elle s'ouvrira même sans Internet.` + (INSTALLER ? `<button class="btn" id="inst">Installer « Ma carte » maintenant</button>` : "");
  const ib = $("#inst"); if (ib) ib.onclick = async () => { const ev = INSTALLER; INSTALLER = null; ev.prompt(); try { await ev.userChoice; } catch(e){} afficher(); };
  try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch(e){}   /* l'écran ne s'éteint pas pendant qu'on scanne */
}
$("#ok").onclick = async () => { const c = $("#cle").value.trim().toUpperCase().replace(/\s+/g, "");
  if (valide(c)) { LS.set("mpCarte", { c, g:"", p:"", t:Date.now() }); afficher(); return; }   /* clé complète (ancienne façon) */
  if (!/^\d{5}$/.test(c)) { $("#err").textContent = "Écris ton code à 5 chiffres."; return; }
  { const e = await codeEssai(c); if (e) { LS.set("mpCarte", { c:e.c, g:e.g, p:e.p, t:Date.now() }); $("#err").textContent = ""; afficher(); return; } }   /* code d'essai (administrateur) */
  $("#err").textContent = "Recherche…";
  try { const o = await chercherCode(c);
    if (o === "bloque") { $("#err").textContent = "Trop d'essais en ce moment. Réessaie dans 10 minutes."; return; }
    if (!o) { $("#err").textContent = "Code inconnu. Vérifie avec ton enseignant."; return; }
    $("#err").textContent = ""; LS.set("mpCarte", { c:o.c, g:o.g || "", p:o.p || "", t:Date.now() }); afficher(); }
  catch(e){ $("#err").textContent = "Internet ne répond pas. Réessaie."; } };
$("#cle").onkeydown = e => { if (e.key === "Enter") $("#ok").click(); }; $("#cle").oninput = () => { if (/^\d{5}$/.test($("#cle").value.trim())) $("#ok").click(); };
$("#oublier").onclick = () => { if (!confirm("Retirer cette carte de ce cellulaire ?")) return; try { localStorage.removeItem("mpCarte"); } catch(e){} afficher(); };
afficher();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
