.cmd .etat{font-size:1rem;padding:6px 14px}
.suivi{padding:0;overflow:hidden}.suivi .bandeau{padding:16px 18px;font-size:1.25rem;font-weight:800;color:#fff;background:#8a94a8}.suivi>small,.suivi>p,.suivi>img,.suivi>span{display:block;margin:10px 18px}
.suivi .motif{font-size:1.1rem;padding:10px 12px;border-radius:10px;background:rgba(200,40,40,.08)}

@keyframes att{to{opacity:.2}}@media (prefers-reduced-motion:reduce){.suivi.attente .bandeau::before{animation:none}}
input.pre{width:100%;max-width:420px;min-height:52px;border-radius:14px;border:2px solid var(--ligne);background:var(--carte);padding:0 16px;font-size:1.15rem}
.cb{display:block;margin:14px auto 4px;max-width:100%;background:#fff;padding:10px;border-radius:8px}
.ov{position:fixed;inset:0;z-index:50;background:var(--fond);overflow:auto;padding:0 0 120px}
.ov[hidden]{display:none}
.sec{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--doux);margin:22px 0 8px}
textarea{width:100%;min-height:80px;border-radius:12px;border:1px solid var(--ligne);background:var(--carte);padding:10px 12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:60;background:var(--txt);color:var(--fond);padding:12px 18px;border-radius:12px;font-weight:600}
.mag-code{position:sticky;top:52px;z-index:10;background:var(--fond);padding:12px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.mag-code input{flex:1;min-width:240px;font:800 2rem/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.15em;padding:12px 16px;border-radius:14px;border:2px solid var(--acc);background:var(--carte)}
.qr{display:inline-block;background:#fff;padding:10px;border-radius:10px}
.prep{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,1fr);gap:18px;max-width:1400px;align-items:start}
@media (max-width:900px){.prep{grid-template-columns:1fr}}
.prep-plan{background:#fff;border:1px solid var(--ligne);border-radius:16px;padding:8px;position:sticky;top:64px}.prep-plan svg{display:block;width:100%;height:auto;max-height:calc(100vh - 100px)}
.prep-g{background:var(--carte);border:1px solid var(--ligne);border-radius:14px;margin-bottom:10px;overflow:hidden}.prep-g.fini{border-color:var(--vert)}
.prep-t{padding:8px 14px;font-weight:800;background:var(--carte2)}.prep-g.fini .prep-t{color:var(--vert)}
.prep-i{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--ligne);cursor:pointer}
.prep-i input{width:28px;height:28px;accent-color:var(--vert);flex:none}.prep-i .rg{font-weight:800;color:var(--acc);min-width:44px}.prep-i .q{font-weight:800;min-width:36px}
.prep-i .nm{flex:1}.prep-i small{display:block;color:var(--doux);font-family:ui-monospace,Menlo,Consolas,monospace}.prep-i.ok{opacity:.55}.prep-i.ok .nm{text-decoration:line-through}
@media print{.top,.barre,.btn,.toast{display:none!important}body{background:#fff}}

<body>
<div class="top"><img src="img/metier-plus-blanc.svg" alt="Métier+"><b id="tTitre">Magasin</b><span class="sp"></span><span class="qui" id="tQui"></span><button id="tSortir" hidden>Changer<span class="gp"> d'élève</span></button></div>
<main id="app"><p class="vide">Chargement…</p></main>
<div class="ov" id="ov" hidden></div>
<div class="barre" id="barre" hidden></div>
<script src="js/qrcode.js"></script><script src="js/code128.js?v=1"></script><script src="js/plan-magasin.js?v=3"></script>
<script>
"use strict";
const SUPA = "https://kjlotlhqrgekzohshmbn.supabase.co", CLE = "sb_publishable_1C-o-75sf7havBRmUWA8aQ_gcEW4sRY";
const $ = s => document.querySelector(s), Q = new URLSearchParams(location.search), MODE = Q.get("mode") || "eleve";
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const LS = { get:(k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } }, set:(k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };
async function rpc(f, a, get){ const r = await fetch(SUPA + "/rest/v1/rpc/" + f, { method:"POST", headers:{ apikey:CLE, "Content-Type":"application/json" }, body:JSON.stringify(a || {}), cache:"no-store" }); if (!r.ok) throw new Error("Supabase " + r.status); const t = await r.text(); return t ? JSON.parse(t) : null; }
const heure = t => { const d = new Date(t); return d.toLocaleDateString("fr-CA", { day:"numeric", month:"short" }) + " " + d.getHours() + " h " + String(d.getMinutes()).padStart(2, "0"); };
function toast(m){ const d = document.createElement("div"); d.className = "toast"; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
function bip(){ try { const a = new AudioContext(), o = a.createOscillator(), g = a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value = 880; g.gain.value = .15; o.start(); setTimeout(() => { o.frequency.value = 1320; }, 140); setTimeout(() => { o.stop(); a.close(); }, 300); } catch(e){} }
/* carte de l'élève : le lecteur de codes-barres tape « MP-123-K7Q9X2 » puis Entrée; à la main, l'élève tape 123 */
const lireCarte = v => { const m = String(v || "").toUpperCase().match(/(\d{5}|\d{3})(?:-([A-Z0-9]{4,12}))?\s*$/); return m ? { code:m[1], cle:m[2] || "" } : null; };

/* ---------- comptes et codes des élèves (registres partagés, numéros seulement) ---------- */
let COMPTES = {};
const nomEns = id => (COMPTES[id] && COMPTES[id].nom) || id;
async function chargerComptes(){ try { COMPTES = (await (await fetch("comptes.json", { cache:"no-cache" })).json()).comptes || {}; } catch(e){ COMPTES = {}; } }
const idPartage = async ens => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode("metier+|partage-passeport|" + ens)))].map(b => b.toString(16).padStart(2, "0")).join("");
async function registre(ens){ try { const r = await rpc("coffre_lire", { p_id:await idPartage(ens) }), row = r && r[0]; const v = row && row.data ? JSON.parse(row.data) : {}; return { grp:v.grp || [], codes:v.codes || {}, part:v.part || {}, noms:v.noms || {} }; } catch(e){ return { grp:[], codes:{}, part:{}, noms:{} }; } }
/* prénom chiffré avec la clé de la carte (publié par le registre) : lisible seulement avec la carte scannée */
async function prenomDeCarte(code, cle, enc){ if (!cle || !enc) return ""; try { const te = new TextEncoder(), b = Uint8Array.from(atob(enc), c => c.charCodeAt(0));
  const k = await crypto.subtle.importKey("raw", await crypto.subtle.digest("SHA-256", te.encode("metier+|carte|" + code + "|" + cle)), "AES-GCM", false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name:"AES-GCM", iv:b.slice(0, 12) }, k, b.slice(12))); } catch(e){ return ""; } }
async function trouverEleve(code){
  const ens = Q.get("e") ? [Q.get("e")] : Object.keys(COMPTES).filter(id => !COMPTES[id].eleve);
  const R = []; await Promise.all(ens.map(async e => { const g = await registre(e); for (const grp in g.codes) if ((g.codes[grp] || []).includes(code)) R.push({ ens:e, groupe:grp, profs:[e, ...(g.part[grp] || [])], enc:g.noms[code] || "" }); }));
  /* 25 nov. : un groupe partagé paraît chez chaque enseignant du groupe → une seule entrée, avec tous ses enseignants */
  const U = {}; R.sort((a, b) => a.ens.localeCompare(b.ens)).forEach(x => { const u = U[x.groupe]; if (!u) U[x.groupe] = x; else x.profs.forEach(id => { if (!u.profs.includes(id)) u.profs.push(id); }); });
  return Object.values(U);
}

/* ---------- catalogue ---------- */
let CAT = [];
const diam = d => String(d || "").trim().replace(/\s+/g, "-");   /* « 1 1/2 » → « 1-1/2 » : un seul mot */
async function chargerCatalogue(){ try { CAT = (await (await fetch("magasin-catalogue.json", { cache:"no-cache" })).json()).raccords || []; } catch(e){ CAT = []; }
  CAT.forEach(a => { a._q = norm([a.nom, a.n, a.mat, a.type].join(" ")); a._m = a._q.split(/[\s°]+/); a._d = diam(a.d); }); }
/* recherche : les mots doivent tous se trouver; un nombre seul (2, 3/4, 1 1/2) = le diamètre exact, sauf un angle (90, 45, 22,5) */
const ANGLES = ["90", "45", "22,5", "22.5", "22"];
function correspond(a, mots){ return mots.every(m => /^\d+([-/.,]\d+)*$/.test(m) && !ANGLES.includes(m) ? a._d === m : a._m.some(w => w.startsWith(m)) || (m.length > 4 && a._q.includes(m))); }   /* début de mot (« té » ne trouve pas « réducteur »); un long mot peut être au milieu */

/* =================================================================== ÉLÈVE =================================================================== */
const pouces = d => String(d).split(" ").reduce((s, x) => { const [n, m] = x.split("/"); return s + (m ? +n / +m : +n || 0); }, 0);
let MOI = LS.get("magEleve", null), PANIER = LS.get("magPanier", {}), FILTRE = { q:"", mat:"", d:"" };
const sauverPanier = () => LS.set("magPanier", PANIER);
const nbPanier = () => Object.values(PANIER).reduce((s, q) => s + q, 0);
function eleveEntree(msg){
  $("#tSortir").hidden = true; $("#tQui").textContent = ""; $("#barre").hidden = true;
  $("#app").innerHTML = `<h1>Magasin de raccords</h1><p class="sous">Scanne ta carte étudiante, ou tape ton code à 5 chiffres.</p>
    <div class="carte"><input class="code" id="cCode" inputmode="numeric" autocomplete="off" autocapitalize="characters" placeholder="00000" aria-label="Ton code">
    <div id="preZ" hidden><label for="cPre" style="display:block;font-weight:600;margin-top:6px">Ton prénom</label><input id="cPre" class="pre" autocomplete="given-name" maxlength="20" placeholder="Prénom seulement"></div>
    <p class="err" id="cErr">${esc(msg || "")}</p><button class="btn p" id="cOk">Entrer</button></div>`;
  const i = $("#cCode"), go = async () => { const c = lireCarte(i.value); if (!c) { $("#cErr").textContent = "Ton code a 5 chiffres."; return; }
    let pre = ($("#cPre").value || "").trim().split(/\s+/)[0];
    $("#cOk").disabled = true; $("#cErr").textContent = "Recherche de ton groupe…";
    const L = await trouverEleve(c.code);
    if (!L.length) { $("#cOk").disabled = false; $("#cErr").textContent = "Code inconnu. Vérifie avec ton enseignant."; return; }
    if (!pre) for (const x of L) { pre = await prenomDeCarte(c.code, c.cle, x.enc); if (pre) break; }   /* carte scannée : le prénom vient du registre */
    if (!pre) { const K = LS.get("mpCarte", null); if (K && K.p && String(K.c || "").includes("-" + c.code + "-")) pre = String(K.p).split(/\s+/)[0]; }
    if (!pre) { $("#cOk").disabled = false; $("#preZ").hidden = false; $("#cErr").textContent = "Écris ton prénom (le magasinier le verra)."; $("#cPre").focus(); return; }
    LS.set("magPrenom", pre);
    if (L.length === 1) return connecter(c.code, L[0]);
    $("#cErr").innerHTML = "Quel est ton groupe ? " + L.map((x, k) => `<button class="btn" data-k="${k}" style="margin:6px 6px 0 0">${esc(x.groupe)} · ${esc(nomEns(x.ens))}</button>`).join("");
    $("#cErr").querySelectorAll("[data-k]").forEach(b => b.onclick = () => connecter(c.code, L[+b.dataset.k])); };
  i.onkeydown = e => { if (e.key === "Enter") go(); }; i.oninput = () => { if (/^\d{5}$/.test(i.value)) go(); }; $("#cPre").onkeydown = e => { if (e.key === "Enter") go(); }; $("#cOk").onclick = go; i.focus();
}
function connecter(code, x){ MOI = { code, ens:x.ens, groupe:x.groupe, profs:(x.profs || []).filter(id => id !== x.ens), prenom:LS.get("magPrenom", "") }; LS.set("magEleve", MOI); eleveCatalogue(); }
function enTete(){ $("#tQui").innerHTML = `<b>${MOI.prenom ? "Bonjour " + esc(MOI.prenom) : ""}</b> <span class="cg">· ${esc(MOI.code)}</span><span class="gp"> · ${esc(MOI.groupe)}</span>`; $("#tSortir").hidden = false;
  $("#tSortir").onclick = () => { if (nbPanier() && !confirm("Ton panier sera vidé. Changer d'élève ?")) return; MOI = null; PANIER = {}; LS.set("magEleve", null); sauverPanier(); eleveEntree(); }; }
function eleveCatalogue(){
  enTete();

/* avis du comptoir : notification de l'ordinateur ou de la tablette (page ouverte), son et titre qui clignote */
function avisComptoir(){ if (!("Notification" in window) || Notification.permission !== "default") return;
  const b = document.createElement("button"); b.className = "btn p"; b.textContent = "Activer les avis des nouvelles commandes"; b.style.margin = "0 0 12px";
  b.onclick = async () => { try { await Notification.requestPermission(); } catch(e){} b.remove(); $("#mC").focus(); }; $("#app").prepend(b); }
let titreT = 0; function clignoterTitre(n){ clearInterval(titreT); const t0 = "Métier+ — Comptoir du magasin", msg = "(" + n + ") Nouvelle commande"; let k = 0;
  titreT = setInterval(() => { document.title = k++ % 2 ? t0 : msg; if (k > 20 || document.hasFocus()) { clearInterval(titreT); document.title = t0; } }, 800); }
async function charger(){ clearTimeout(magT);
  try { MAG = await rpc("panier_magasin", {}) || [];
    try { const S2 = new Map(); if (MAG.length) for (const r of await rpc("panier_signalements", { p_ids:MAG.map(p => p.id) }) || []) { if (!S2.has(r.panier)) S2.set(r.panier, new Set()); S2.get(r.panier).add(r.regle); } SIG = S2; } catch(e){} const ids = MAG.filter(p => p.etat === "approuve").map(p => p.id);
    { const neufs = MAG_VUS ? MAG.filter(p => p.etat === "approuve" && !MAG_VUS.has(p.id)) : [];   /* 25 nov. (Jeremy) : le magasinier est averti d'une commande qui entre */
      if (neufs.length) { bip(); setTimeout(bip, 350); clignoterTitre(neufs.length);
        try { if ("Notification" in window && Notification.permission === "granted") neufs.slice(0, 3).forEach(p => { const n = new Notification("Magasin : nouvelle commande", { body:(p.prenom || "Élève") + " (" + p.code + ", " + p.groupe + ") · " + (p.items || []).length + " raccord(s)", tag:"mag-" + p.id, icon:"img/metier-plus.svg" }); n.onclick = () => { focus(); n.close(); }; }); } catch(e){} } } MAG_VUS = MAG_VUS || new Set(); ids.forEach(id => MAG_VUS.add(id)); dessinerMag(); }
  catch(e){ $("#mL").innerHTML = `<p class="err">Supabase ne répond pas. Nouvel essai dans 10 s.</p>`; }
  magT = setTimeout(charger, 10000); }
const OUV = new Set();   /* commandes terminées que l'utilisateur a rouvertes */
const MODE_PROF = /[?&]mode=prof/.test(location.search);
document.addEventListener("click", e => { const h = e.target.closest(".cmd.fin > .h"); if (!h || (e.target.closest("button,a,select,input") && !e.target.closest(".fl"))) return;
  const c = h.parentNode, id = c.dataset.cid; c.classList.toggle("repli"); c.classList.contains("repli") ? OUV.delete(id) : OUV.add(id); });
const REG_ATT = new Map();   /* règles cochées, pas encore envoyées (id du panier → numéros) */
async function envoyerRegles(id, L){ let n = 0; for (const r of L) { try { const o = await rpc("panier_signaler", { p_id:id, p_regle:r }); if (o && o.ok) { n++; if (!SIG.has(id)) SIG.set(id, new Set()); SIG.get(id).add(r); } } catch(e){} }
  if (n) toast("Enseignant averti : " + L.map(r => REGLES_L[r]).join(", ") + "."); return n; }
const REGLES = [null, "Nom exact du raccord", "Carte étudiante", "Consignes d'accès", "Matériel propre", "Feuille de l'enseignant", "Bris / usage perso"];
const REGLES_L = [null, "Ne connaissait pas le nom exact du raccord", "Sans carte étudiante", "Consignes d'accès non respectées", "Matériel rendu sale", "Sans feuille de l'enseignant", "Bris ou usage personnel"];
let SIG = new Map();
function dessinerMag(){
  const z = $("#mL"); if (!z) return;
  const v = MAG.filter(p => !FILTRE_CODE || p.code === FILTRE_CODE), app = v.filter(p => p.etat === "approuve"), rem = v.filter(p => p.etat === "remis").reverse();
  const carte = p => `<div class="cmd e-${esc(p.etat)}${p.etat === "remis" ? " fin" + (OUV.has(p.id) ? "" : " repli") : ""}" data-cid="${esc(p.id)}"><div class="h"><button class="fl" aria-label="Voir le détail"></button><span class="n">${esc(p.code)}</span><div><b class="pr">${esc(p.prenom || "")}</b> <b>${esc(p.groupe)}</b> · ${esc(nomEns(p.ens))}<br><small class="sous">Approuvé ${heure(p.t_app)}</small></div><span class="sp"></span>
    ${p.etat === "approuve" ? `<button class="btn p" data-prep="${p.id}">Préparer</button>` : ""}<button class="btn" data-imp="${p.id}" style="min-height:42px">Imprimer le bon</button> ${p.etat === "approuve" ? `<button class="btn v" data-rem="${p.id}">Remis à l'élève</button>` : `<span class="etat remis">Remis ${heure(p.t_remis)}</span> <button class="btn" data-ann="${p.id}" style="min-height:38px">Annuler</button>`}</div>
    ${p.note ? `<p style="margin:10px 16px 0"><b>Travail :</b> ${esc(p.note)}</p>` : ""}
    ${tableMag(p)}
    <div class="regl"><span>Règlement non respecté${p.etat === "approuve" ? " <small>(envoyé à l'enseignant quand tu confirmes « Remis »)</small>" : ""} :</span>${REGLES.slice(1).map((t, i) => `<button class="btn${(SIG.get(p.id) || new Set()).has(i + 1) ? " sig" : (REG_ATT.get(p.id) || new Set()).has(i + 1) ? " att" : ""}" data-sig="${p.id}|${i + 1}" title="Avertir l'enseignant">${t}</button>`).join("")}</div></div>`;
  z.innerHTML = (FILTRE_CODE ? `<p class="sous">Élève <b>${esc(FILTRE_CODE)}</b> : ${app.length ? app.length + " commande" + (app.length > 1 ? "s" : "") + " à préparer" : "aucune commande approuvée"}.</p>` : "")
    + `<div class="sec">À préparer (${app.length})</div>` + (app.length ? app.map(carte).join("") : `<p class="vide">${FILTRE_CODE ? "Rien pour cet élève. Son enseignant doit d'abord approuver son panier." : "Aucune commande approuvée pour l'instant."}</p>`)
    + (rem.length ? `<div class="sec">Remis aujourd'hui (${rem.length})</div>` + rem.map(carte).join("") : "");
  z.querySelectorAll("[data-prep]").forEach(b => b.onclick = () => preparer(MAG.find(p => p.id === b.dataset.prep)));
  z.querySelectorAll("[data-imp]").forEach(b => b.onclick = () => imprimerBon(MAG.find(p => p.id === b.dataset.imp)));
  z.querySelectorAll("[data-rem]").forEach(b => b.onclick = () => remettre(b.dataset.rem, true));
  z.querySelectorAll("[data-ann]").forEach(b => b.onclick = () => remettre(b.dataset.ann, false));
  /* 25 nov. (Jeremy) : la règle est cochée ici, puis envoyée à l'enseignant seulement quand le magasinier confirme « Remis » */
  z.querySelectorAll("[data-sig]").forEach(b => b.onclick = async () => { if (b.classList.contains("sig")) return; const [id, r] = b.dataset.sig.split("|"), p = MAG.find(x => x.id === id);
    if (p && p.etat === "remis") { b.disabled = true; await envoyerRegles(id, [+r]); b.disabled = false; dessinerMag(); return; }   /* déjà remis : envoi tout de suite */
    const P = REG_ATT.get(id) || new Set(); P.has(+r) ? P.delete(+r) : P.add(+r); REG_ATT.set(id, P); b.classList.toggle("att", P.has(+r)); });
}
/* rangée de chaque raccord (celle du panier, sinon celle du catalogue actuel); le bon est trié par rangée = un seul tour du magasin */
const rangee = i => i.r || ((CAT.find(a => a.id === i.id || a.n === i.n) || {}).r) || "";
const parRangee = L => [...(L || [])].sort((a, b) => rangee(a).localeCompare(rangee(b), "fr", { numeric:true }) || String(a.nom).localeCompare(String(b.nom), "fr"));
const tableMag = p => `<table><tr><th>Rangée</th><th>Qté</th><th>Raccord</th><th>N° d'article</th></tr>${parRangee(p.items).map(i => `<tr><td class="rg">${esc(rangee(i) || "–")}</td><td class="q">${+i.q || 1}</td><td>${esc(i.nom)}</td><td class="no">${esc(i.n)}</td></tr>`).join("")}</table>`;
/* préparation (25 nov., Jeremy : « les rangées pourraient flasher sur son iPad et quand il coche, ça cesse ») */
function preparer(p){ if (!p) return;
  const cle = "magPrep|" + p.id, faits = new Set(LS.get(cle, [])), L = parRangee(p.items), ov = $("#ov");
  ov.hidden = false; document.body.style.overflow = "hidden";
  const dessiner = () => {
    const lettres = new Set(L.map(i => PlanMagasin.lettre(rangee(i))).filter(Boolean));
    const finies = new Set([...lettres].filter(l => L.filter(i => PlanMagasin.lettre(rangee(i)) === l).every(i => faits.has(i.id || i.n))));
    const tout = L.every(i => faits.has(i.id || i.n));
    ov.innerHTML = `<div class="top"><img src="img/metier-plus-blanc.svg" alt=""><b>Préparer · ${esc(p.prenom || "élève")} (${esc(p.code)})</b><span class="sp"></span><button id="prF">‹ Comptoir</button></div>
      <main class="prep"><div class="prep-plan">${PlanMagasin.svg(lettres, finies, L.map(i => ({ r:rangee(i), fait:faits.has(i.id || i.n) })))}</div><div class="prep-l">
      <p class="sous">${esc(p.groupe)} · ${esc(nomEns(p.ens))}${p.note ? " · " + esc(p.note) : ""}</p>
      ${[...lettres, ""].map(l => { const G = L.filter(i => PlanMagasin.lettre(rangee(i)) === l); if (!G.length) return "";
        return `<div class="prep-g${finies.has(l) ? " fini" : ""}"><div class="prep-t">${l ? "Rangée " + esc(l) : "Sans rangée"}</div>${G.map(i => { const k = i.id || i.n, ok = faits.has(k);
          return `<label class="prep-i${ok ? " ok" : ""}"><input type="checkbox" data-k="${esc(k)}"${ok ? " checked" : ""}><span class="rg"><i class="pt">${L.indexOf(i) + 1}</i>${esc(rangee(i) || "–")}</span><span class="q">${+i.q || 1} ×</span><span class="nm">${esc(i.nom)}<small>${esc(i.n)}</small></span></label>`; }).join("")}</div>`; }).join("")}
      <button class="btn ${tout ? "v" : ""}" id="prOk" ${tout ? "" : "disabled"} style="width:100%;margin-top:10px">${tout ? "Tout est prêt · remis à l'élève" : "Coche chaque raccord en le prenant"}</button></div></main>`;
    $("#prF").onclick = () => { ov.hidden = true; document.body.style.overflow = ""; dessinerMag(); $("#mC").focus(); };
    ov.querySelectorAll("[data-k]").forEach(c => c.onchange = () => { c.checked ? faits.add(c.dataset.k) : faits.delete(c.dataset.k); LS.set(cle, [...faits]); dessiner(); });
    $("#prOk").onclick = async () => { await remettre(p.id, true); try { localStorage.removeItem(cle); } catch(e){} ov.hidden = true; document.body.style.overflow = ""; };
  };
  dessiner();
}
function imprimerBon(p){ if (!p) return;
  const h = `<!DOCTYPE html><html lang="fr-CA"><head><meta charset="utf-8"><title>Bon ${esc(p.code)}</title><style>body{font:12pt/1.35 system-ui,sans-serif;color:#000;margin:14mm}h1{font-size:18pt;margin:0}.s{color:#444;margin:2pt 0 10pt}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #999;padding:6pt 4pt;text-align:left}th{font-size:9pt;color:#444}td.rg{font-weight:800;font-size:14pt;width:60pt}td.q{font-weight:800;width:40pt}td.no{font-family:monospace}td.ok{width:30pt}.n{font:900 28pt monospace;float:right}</style></head><body>`
    + `<span class="n">${esc(p.code)}</span><h1>Bon de préparation · ${esc(p.prenom || "Magasin")}</h1><p class="s">${esc(p.groupe)} · ${esc(nomEns(p.ens))} · approuvé ${heure(p.t_app)}${p.note ? " · " + esc(p.note) : ""}</p>`
    + `<table><tr><th>Rangée</th><th>Qté</th><th>Raccord</th><th>N° d'article</th><th>✓</th></tr>${parRangee(p.items).map(i => `<tr><td class="rg">${esc(rangee(i) || "–")}</td><td class="q">${+i.q || 1}</td><td>${esc(i.nom)}</td><td class="no">${esc(i.n)}</td><td class="ok">☐</td></tr>`).join("")}</table></body></html>`;
  const f = document.createElement("iframe"); f.style.cssText = "position:fixed;width:0;height:0;border:0;left:-10px"; document.body.appendChild(f);
  f.contentDocument.open(); f.contentDocument.write(h); f.contentDocument.close(); setTimeout(() => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch(e){} setTimeout(() => f.remove(), 60000); }, 300); }
async function remettre(id, oui){ try { await rpc("panier_remettre", { p_id:id, p_remis:oui });
    if (oui && REG_ATT.get(id) && REG_ATT.get(id).size) { await envoyerRegles(id, [...REG_ATT.get(id)]); REG_ATT.delete(id); } const p = MAG.find(x => x.id === id); if (p) { p.etat = oui ? "remis" : "approuve"; p.t_remis = oui ? new Date().toISOString() : null; } dessinerMag(); $("#mC").focus(); } catch(e){ toast("Impossible : " + e.message); } }

/* =================================================================== départ =================================================================== */
(async () => {
  await Promise.all([chargerComptes(), chargerCatalogue()]);
  if (MODE === "prof") return prof();
  if (MODE === "magasin") return magasinier();
  if (MOI && MOI.code) return eleveCatalogue();
  const K = LS.get("mpCarte", null);   /* « Ma carte Métier+ » sur ce cellulaire : entrée directe */
  if (K && K.c) { eleveEntree(); $("#cCode").value = K.c; $("#cOk").click(); return; }
  eleveEntree();
})();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
