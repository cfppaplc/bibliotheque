<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Métier+ — Sons de fin du ménage</title>
<style>
body{margin:0;font-family:"Segoe UI",Roboto,sans-serif;background:#0e1320;color:#fff;display:flex;flex-direction:column;align-items:center;padding:30px 16px}
h1{font-size:1.6rem;margin:0 0 6px}p{color:#aab3c5;margin:0 0 24px;text-align:center}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;width:min(1000px,100%)}
button{background:#161d2c;border:2px solid #2a3550;border-radius:18px;color:#fff;padding:22px;text-align:left;cursor:pointer;font:inherit;min-height:120px}
button:hover,button.on{border-color:#EB6A22}
b{display:block;font-size:1.35rem;margin-bottom:6px}b i{font-style:normal;color:#EB6A22;margin-right:8px}
span{color:#aab3c5;font-size:.95rem}
</style></head><body>
<h1>Sons de fin du ménage</h1>
<p>Touche une carte pour l'écouter. Dis à Claude le numéro que tu préfères.</p>
<div class="g">
 <button data-s="1"><b><i>1</i>Fanfare</b><span>Montée de 4 notes, « ta-ta », grand accord (celle en place).</span></button>
 <button data-s="2"><b><i>2</i>Victoire de jeu vidéo</b><span>Arpège rapide style arcade, puis note qui tient.</span></button>
 <button data-s="3"><b><i>3</i>Roulement + cymbale</b><span>Roulement de tambour qui monte, coup de cymbale et accord.</span></button>
 <button data-s="4"><b><i>4</i>Applaudissements</b><span>Petit « ding-ding » puis la foule qui applaudit.</span></button>
 <button data-s="5"><b><i>5</i>Carillon</b><span>Cloches douces, plus calme.</span></button>
 <button data-s="6"><b><i>6</i>Sifflet de fin de match</b><span>Trois coups de sifflet d'arbitre, puis la foule.</span></button>
</div>
<script>
let AC;
function ctx(){ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if (AC.state==="suspended") AC.resume(); const o = AC.createGain(); o.gain.value = .55; o.connect(AC.destination); return [AC.currentTime+.03, o]; }
function note(out,f,t,d,v,type,glide){ const o=AC.createOscillator(),g=AC.createGain(); o.type=type||"triangle"; o.frequency.setValueAtTime(f,t); if(glide) o.frequency.linearRampToValueAtTime(glide,t+d);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.012); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g); g.connect(out); o.start(t); o.stop(t+d+.05); }
function bruit(out,t,d,v,filtre,q){ const n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0); for(let i=0;i<n;i++)c[i]=Math.random()*2-1;
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(); s.buffer=b; f.type="bandpass"; f.frequency.value=filtre||2000; f.Q.value=q||.8;
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+d); s.connect(f); f.connect(g); g.connect(out); s.start(t); }
const SONS={
 1(){ const [t,o]=ctx(); [523,659,784,1047].forEach((f,k)=>note(o,f,t+k*.12,.3,.55,"square")); [784,1047].forEach((f,k)=>note(o,f,t+.55+k*.12,.2,.5,"square"));
   [523,659,784,1047,1319].forEach(f=>{note(o,f,t+.85,1.6,.32,"sawtooth");note(o,f,t+.85,1.8,.35)}); note(o,130.8,t+.85,1.6,.5); },
 2(){ const [t,o]=ctx(); [392,523,659,784,1047,1319,1568].forEach((f,k)=>note(o,f,t+k*.07,.12,.45,"square"));
   [1047,1319,1568,2093].forEach((f,k)=>note(o,f,t+.6+k*.05,.15,.4,"square")); note(o,2093,t+.85,1.1,.4,"square"); note(o,1047,t+.85,1.1,.3,"triangle"); },
 3(){ const [t,o]=ctx(); for(let i=0;i<34;i++){ const ti=t+i*.045; bruit(o,ti,.08,.12+i*.012,1800,1.2); }
   bruit(o,t+1.6,1.8,.9,6000,.5); bruit(o,t+1.6,.25,1,150,1); [262,330,392,523].forEach(f=>{note(o,f,t+1.6,1.6,.35,"sawtooth");note(o,f*2,t+1.6,1.6,.2)}); },
 4(){ const [t,o]=ctx(); note(o,1319,t,.4,.5,"sine"); note(o,1760,t+.15,.6,.5,"sine");
   for(let i=0;i<140;i++){ const ti=t+.4+Math.random()*2.6, env=Math.min(1,(ti-t-.4)/.4)*Math.max(0,1-(ti-t-2.2)/.8); bruit(o,ti,.05,.35*env+.02,1500+Math.random()*2500,1.5); } },
 5(){ const [t,o]=ctx(); [[1319,0],[1047,.25],[1175,.5],[784,.75],[784,1.25],[1175,1.5],[1319,1.75],[1047,2]].forEach(([f,d])=>{note(o,f,t+d,1.4,.35,"sine");note(o,f*2.76,t+d,.6,.08,"sine")}); },
 6(){ const [t,o]=ctx(); [[0,.18],[.3,.18],[.6,.9]].forEach(([d,l])=>{ note(o,2900,t+d,l,.35,"sine",3100); note(o,2950,t+d,l,.2,"sine"); bruit(o,t+d,l,.1,3000,3); });
   for(let i=0;i<120;i++){ const ti=t+1.4+Math.random()*2.2; bruit(o,ti,.05,.28*Math.max(0,1-(ti-t-1.4)/2.2)+.03,1800+Math.random()*2000,1.5); } }
};
document.querySelectorAll("button").forEach(b=>b.onclick=()=>{ document.querySelectorAll("button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); SONS[b.dataset.s](); });
</script></body></html>
