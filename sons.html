<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><script src="garde-admin.js"></script><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Métier+ — Sons de fin du ménage</title>
<style>
body{margin:0;font-family:"Segoe UI",Roboto,sans-serif;background:#0e1320;color:#fff;display:flex;flex-direction:column;align-items:center;padding:30px 16px}
h1{font-size:1.6rem;margin:0 0 6px}p{color:#aab3c5;margin:0 0 24px;text-align:center}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;width:min(1000px,100%)}
button{background:#161d2c;border:2px solid #2a3550;border-radius:18px;color:#fff;padding:22px;text-align:left;cursor:pointer;font:inherit;min-height:120px}
button:hover,button.on{border-color:#EB6A22}
b{display:block;font-size:1.35rem;margin-bottom:6px}b i{font-style:normal;color:#EB6A22;margin-right:8px}
span{color:#aab3c5;font-size:.95rem}
</style></head><body>
<h1>Sons de fin du ménage</h1>
<p>Touche une carte pour l'écouter. Dis à Claude le numéro que tu préfères.</p>
<div class="g">
 <button data-s="1"><b><i>1</i>Accord de piano</b><span>Un accord chaud et posé, qui résonne.</span></button>
 <button data-s="2"><b><i>2</i>Confirmation douce</b><span>Deux notes claires, comme une validation sur un appareil.</span></button>
 <button data-s="3"><b><i>3</i>Marimba</b><span>Trois notes boisées qui montent, discret et chaleureux.</span></button>
 <button data-s="4"><b><i>4</i>Nappe qui s'ouvre</b><span>Son feutré qui s'élève lentement, style ambiance.</span></button>
 <button data-s="5"><b><i>5</i>Cloche de réception</b><span>Un seul « ding » net de clochette d'hôtel.</span></button>
 <button data-s="6"><b><i>6</i>Résolution jazz</b><span>Petite progression d'accords qui se termine en douceur.</span></button>
</div>
<script>
let AC;
function ctx(){ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if (AC.state==="suspended") AC.resume(); const o = AC.createGain(); o.gain.value = .55; o.connect(AC.destination); return [AC.currentTime+.03, o]; }
function note(out,f,t,d,v,type,glide){ const o=AC.createOscillator(),g=AC.createGain(); o.type=type||"triangle"; o.frequency.setValueAtTime(f,t); if(glide) o.frequency.linearRampToValueAtTime(glide,t+d);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.012); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g); g.connect(out); o.start(t); o.stop(t+d+.05); }
function bruit(out,t,d,v,filtre,q){ const n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0); for(let i=0;i<n;i++)c[i]=Math.random()*2-1;
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(); s.buffer=b; f.type="bandpass"; f.frequency.value=filtre||2000; f.Q.value=q||.8;
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+d); s.connect(f); f.connect(g); g.connect(out); s.start(t); }
function piano(out,f,t,d,v){ [1,2,3,4].forEach((h,k)=>note(out,f*h,t,d/(1+k*.6),v/(1+k*1.8),"sine")); }
function echo(o){ const dl=AC.createDelay(),fb=AC.createGain(),w=AC.createGain(); dl.delayTime.value=.23; fb.gain.value=.32; w.gain.value=.35; const e=AC.createGain(); e.connect(AC.destination); e.gain.value=.55; o.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(w); w.connect(e); return o; }
const SONS={
 1(){ const [t,o]=ctx(); echo(o); [261.6,329.6,392,493.9,587.3].forEach((f,k)=>piano(o,f,t+k*.04,3.2,.32)); piano(o,130.8,t,3.4,.35); },
 2(){ const [t,o]=ctx(); echo(o); note(o,880,t,.5,.4,"sine"); note(o,1318.5,t+.14,1.1,.4,"sine"); note(o,2637,t+.14,.4,.06,"sine"); },
 3(){ const [t,o]=ctx(); echo(o); [[523.3,0],[659.3,.13],[784,.26],[1046.5,.42]].forEach(([f,d])=>{ note(o,f,t+d,.6,.45,"sine"); note(o,f*4,t+d,.08,.12,"sine"); }); },
 4(){ const [t,o]=ctx(); [261.6,392,523.3,659.3,784].forEach((f,k)=>{ const os=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter(); os.type="sawtooth"; os.frequency.value=f; os.detune.value=(k%2?6:-6);
     fl.type="lowpass"; fl.frequency.setValueAtTime(300,t); fl.frequency.linearRampToValueAtTime(2200,t+1.6); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.09,t+1.2); g.gain.linearRampToValueAtTime(0,t+3.4);
     os.connect(fl); fl.connect(g); g.connect(o); os.start(t); os.stop(t+3.5); }); note(o,1568,t+1.2,1.8,.12,"sine"); },
 5(){ const [t,o]=ctx(); echo(o); [[2093,1],[5278,.25],[3136,.18],[6900,.06]].forEach(([f,v])=>note(o,f,t,2.4,.45*v,"sine")); },
 6(){ const [t,o]=ctx(); echo(o); [[[146.8,349.2,440,523.3],0],[[196,349.2,493.9,587.3],.55],[[130.8,329.6,392,493.9,587.3],1.1]].forEach(([acc,d],k)=>acc.forEach(f=>piano(o,f,t+d,k===2?3:.9,.26))); }
};
document.querySelectorAll("button").forEach(b=>b.onclick=()=>{ document.querySelectorAll("button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); SONS[b.dataset.s](); });
</script></body></html>
